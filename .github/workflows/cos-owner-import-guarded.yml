name: COS Owner equipment guarded import tests
on:
  pull_request:
    paths:
      - 'tech-checks/operations/tests/mhelp-*.test.mjs'
      - 'tech-checks/operations/tests/mhelp-canonical-evidence-postgres.mjs'
      - 'tech-checks/operations/scripts/prepareOwnerCanonicalEvidenceSql.mjs'
      - 'tech-checks/operations/scripts/prepareUploadSnapshotOnceSql.mjs'
      - 'tech-checks/operations/scripts/prepareOwnerAssignmentReviewIndexedSql.mjs'
      - 'tech-checks/operations/scripts/prepareOwnerAssignmentTimestampRuntime.mjs'
      - 'tech-checks/operations/tests/fixtures/assignment-timestamps.mjs'
      - 'tech-checks/operations/tests/fixtures/assignment-review-before-20261021.sql'
      - 'tech-checks/operations/tests/fixtures/assignment-review-indexed.mjs'
      - 'tech-checks/operations/docs/drafts/cos-owner-assignment-review-indexed-20261021.sql'
      - 'tech-checks/operations/tests/fixtures/upload-snapshot-before-20261021.sql'
      - 'tech-checks/operations/docs/drafts/cos-upload-snapshot-once-20261021.sql'
      - 'tech-checks/operations/docs/drafts/cos-owner-canonical-evidence.sql'
      - 'tech-checks/operations/docs/drafts/cos-owner-equipment-stage-commit-20261016.sql'
      - 'tech-checks/supabase/functions/cos-operations-pages/mhelp*Equipment*.ts'
      - 'tech-checks/supabase/functions/cos-operations-pages/mhelp2027ProductCensus.ts'
      - '.github/workflows/cos-owner-import-guarded.yml'
permissions:
  contents: read
concurrency:
  group: cos-owner-guarded-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guarded-owner-source:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: cos_owner_import_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cos_owner_import_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package.json
      - run: npm install --no-audit --no-fund
      - name: Test private source validation and draft transactional admission
        run: |
          node --import tsx --test --test-concurrency=1 \
            tests/mhelp-equipment-csv-preview.test.mjs \
            tests/mhelp-equipment-admission-plan.test.mjs \
            tests/mhelp-2027-product-census.test.mjs \
            tests/mhelp-owner-review.test.mjs \
            tests/mhelp-equipment-write-bridge.test.mjs \
            tests/mhelp-owner-staging-pglite.test.mjs \
            tests/mhelp-assignment-review.test.mjs \
            tests/mhelp-canonical-evidence-postgres.mjs \
            tests/mhelp-upload-snapshot-once.test.mjs
      - name: Verify timestamp formats and guarded runtime replacement
        timeout-minutes: 2
        run: node --import tsx --test --experimental-test-isolation=none tests/mhelp-assignment-timestamps.test.mjs tests/mhelp-assignment-timestamp-runtime.test.mjs
      - name: Rebuild exact approved PR273 helper artifact
        timeout-minutes: 2
        run: |
          mkdir -p review-artifacts
          node --input-type=module <<'NODE'
          import {build} from 'esbuild';
          import {createHash} from 'node:crypto';
          import {writeFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          const source=resolve('../supabase/functions/cos-operations-pages/mhelpEquipmentAssignmentReview.ts');
          const built=await build({
            stdin:{contents:`export {reviewOwnerEquipmentAssignments} from ${JSON.stringify(source)};`,resolveDir:resolve('.')},
            bundle:true,write:false,format:'iife',globalName:'CosOwnerAssignmentReviewRelease',
            platform:'neutral',target:'es2022',minifyWhitespace:true,minifySyntax:true
          });
          const helper=built.outputFiles[0].text+'\n';
          const sha=createHash('sha256').update(helper).digest('hex');
          if(sha!=='db75da92a418caac35a3678851a134f3406eaf13850fc9cf446913ec12e2c8c6') throw Error('Compiled helper SHA drift: '+sha);
          await writeFile('review-artifacts/pr273-compiled-helper.txt',helper);
          NODE
      - name: Upload exact approved PR273 helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr273-compiled-helper
          path: tech-checks/operations/review-artifacts/pr273-compiled-helper.txt
          if-no-files-found: error
          retention-days: 3
      - name: Verify full-size indexed assignment review
        timeout-minutes: 2
        run: node --test --experimental-test-isolation=none tests/mhelp-assignment-review-indexed.test.mjs
      - name: Verify real PostgreSQL 17 Owner equipment transaction
        timeout-minutes: 4
        env:
          COS_OWNER_POSTGRES_CI: '1'
        run: |
          command -v psql
          node tests/mhelp-owner-postgres.ci.mjs
      - name: Verify assignment review against real PostgreSQL 17
        timeout-minutes: 4
        env:
          COS_ASSIGNMENT_POSTGRES_CI: '1'
        run: node --import tsx --test --test-concurrency=1 tests/mhelp-assignment-review.test.mjs tests/mhelp-canonical-evidence-postgres.mjs tests/mhelp-upload-snapshot-once.test.mjs
      - name: Verify indexed assignment review against real PostgreSQL 17
        timeout-minutes: 4
        env:
          COS_ASSIGNMENT_POSTGRES_CI: '1'
        run: node --test --experimental-test-isolation=none tests/mhelp-assignment-review-indexed.test.mjs
      - name: Typecheck COS Owner importer and existing app
        run: npm run typecheck

