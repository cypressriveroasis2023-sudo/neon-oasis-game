name: Temporary COS PR365 exact frontend builder
on:
  push:
    branches:
      - fix/fleet-refresh-preservation-20261107-pr364
    paths:
      - .github/workflows/cos-pr365-build-candidate.yml
permissions:
  contents: write
concurrency:
  group: temp-pr365-exact-build
  cancel-in-progress: false
jobs:
  exact-build:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - name: Fail closed on branch or main movement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '19ac0037a26c9c56cc42776cd0e6d66d9fe62f68'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '34cd9ab5c1ec78eeaec5d24c66ab8f1f4a8616d0'
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse HEAD:tech-checks/operations/src/api.ts)" = '1114275296c4b59b85207fadd7da9e1b8d30ab4b'
          test "$(git rev-parse HEAD:tech-checks/operations/tests/api-inflight-reads.test.mjs)" = 'a38dd1dea6b992ca70a941648a00745c6e51116d'
          test "$(git rev-parse HEAD:tech-checks/operations/tests/fleet-connection-read-preservation.json)" = '260ff7681c5e4269c577372bc7f4879d6acf33ba'
      - name: Install locked dependencies
        working-directory: tech-checks/operations
        run: npm ci --no-audit --no-fund
      - name: Verify source guards, proof timing and types
        working-directory: tech-checks/operations
        run: |
          node --import tsx --test tests/api-inflight-reads.test.mjs tests/approved-fleet-unit.test.mjs
          npm run typecheck
      - name: Rebuild current-main frontend without clearing previously published bundles
        working-directory: tech-checks/operations
        run: npm run build
      - name: Stage only generated bundles and assert exact output scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- tech-checks/operations/package-lock.json
          git add -A tech-checks/operations/dist
          node --input-type=commonjs <<'NODE'
          const {execFileSync}=require('node:child_process');
          const assert=require('node:assert/strict');
          const stdout=execFileSync('git',['diff','--cached','--name-status'],{encoding:'utf8'}).trim();
          const staged=stdout.split('\n').filter(Boolean).map(line=>line.split('\t')).map(([status,path])=>({status,path}));
          assert.equal(staged.length,3,'Only two new JS bundles and updated dist/index.html are allowed');
          assert.equal(staged.filter(x=>x.status==='M'&&x.path==='tech-checks/operations/dist/index.html').length,1);
          assert.equal(staged.filter(x=>x.status==='A'&&/^tech-checks\/operations\/dist\/assets\/durableFleetClient-[\w-]+\.js$/.test(x.path)).length,1);
          assert.equal(staged.filter(x=>x.status==='A'&&/^tech-checks\/operations\/dist\/assets\/index-[\w-]+\.js$/.test(x.path)).length,1);
          console.log(JSON.stringify(staged));
          NODE
          git diff --cached --check
      - name: Commit generated files and enforce byte-for-byte artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'COS reviewed artifact builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'build(fleet): commit current-main contention repair bundle'
          (cd tech-checks/operations && node ../../.github/scripts/verify-cos-build-artifact.mjs)
          git fetch origin main
          test "$(git rev-parse origin/main)" = '34cd9ab5c1ec78eeaec5d24c66ab8f1f4a8616d0'
          git push origin HEAD:fix/fleet-refresh-preservation-20261107-pr364
          git rev-parse HEAD
