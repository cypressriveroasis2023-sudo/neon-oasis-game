name: Prepare reviewed COS independent power repair
on:
  push:
    branches: [fix/cos-independent-victron-evidence-20261020]
    paths: ['.github/workflows/prepare-cos-independent-power-20261020.yml']
permissions:
  contents: write
jobs:
  prepare-reviewed-branch:
    if: github.ref == 'refs/heads/fix/cos-independent-victron-evidence-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the already-published PR 239 application bytes
        run: |
          node .github/scripts/verify-cos-pages.mjs
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('tech-checks/operations/dist/index.html','utf8');
          const asset=html.match(/src="\.\/(assets\/[^" ]+\.js)"/)?.[1];
          assert.ok(asset,'Existing Operations asset not found');
          const source=readFileSync('tech-checks/operations/dist/'+asset,'utf8');
          assert.ok(source.includes('need COS equipment association'),'PR 239 identity diagnostics missing');
          assert.ok(source.includes('flagged inactive in mHelp'),'PR 239 lifecycle diagnostics missing');
          console.log('LIVE_PR239_VERIFIED '+asset+'; actual Pages bytes match committed diagnostics');
          JS
      - name: Apply only exact reviewed source transformations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('tech-checks/operations')
          expected={
           'src/fleetCommandCenterModel.ts':'a6669f8b3b2107be3473d8c33545015e9c04c6e2',
           'src/FleetCommandCenter.tsx':'839ea2d59519a5431b78d4af9cbad542e3dc13a7',
           'src/FleetDashboard.tsx':'f60154ecd88a205148a9c12faee4eb00902fea64',
           'src/refreshCadence.ts':'2ccdc926d429e2bcb0d203716d6d872ee98da73c',
           'tests/fleet-command-center.test.mjs':'3aeac64c5021ab8809bd1416b1b744ce25d1bd6b',
          }
          for path,sha in expected.items():
           actual=subprocess.check_output(['git','hash-object',str(root/path)],text=True).strip()
           assert actual==sha, f'Concurrent edit detected: {path}'
          def replace_once(text,old,new):
           assert text.count(old)==1, f'Expected one exact edit anchor: {old[:90]}'
           return text.replace(old,new,1)
          p=root/'src/fleetCommandCenterModel.ts';s=p.read_text()
          s=replace_once(s,"import {readVrmFleetConfig} from '../../supabase/functions/cos-operations-pages/vrm';", "import {readVrmFleetConfig} from '../../supabase/functions/cos-operations-pages/vrm';\nimport {verifiedFleetPower} from './fleetPowerVerification';")
          s=replace_once(s,"import {cameraTimestamp} from './cameraEvidence';\n",'')
          s=replace_once(s,'cameraCheckedAt:string|null=null\n)', 'cameraCheckedAt:string|null=null,inventoryReadSucceeded=healthReadSucceeded\n)')
          a=s.index('  const seenInstallations=new Set<number>();');b=s.index('  panels.push({',a)
          s=s[:a]+'''  // Inventory identity and power evidence have independent read boundaries.
            // A camera-provider failure must not erase a fresh, exact Product-ID power link.
            const powerProducts=mhelpProviderFleet(upload,fieldHealth,inventoryReadSucceeded,now);
            const inventoryLinks=new Map((powerProducts?.healthVerified?powerProducts.groups.flatMap(g=>g.items):[])
              .map(p=>[p.productId,p.linked]));
            const victron=helios.map(p=>{
              const linked=inventoryLinks.get(p.productId)||null;
              const evidence=verifiedFleetPower(recordById.get(p.productId),linked,rows,config,now);
              const status:FleetCommandStatus=evidence.online?'online':'unverified';
              vrmCounts[status]++;
              return {...p,linked,status,reason:evidence.reason};
            });
          '''+s[b:]
          p.write_text(s)
          p=root/'src/FleetCommandCenter.tsx';s=p.read_text()
          s=replace_once(s,' healthReadSucceeded:boolean;',' healthReadSucceeded:boolean;\n inventoryReadSucceeded?:boolean;')
          s=replace_once(s,' uploadInventory,fieldHealth,healthReadSucceeded,rows,addressMap,vrm,now,cameraCheckedAt,',' uploadInventory,fieldHealth,healthReadSucceeded,inventoryReadSucceeded=healthReadSucceeded,rows,addressMap,vrm,now,cameraCheckedAt,')
          s=replace_once(s,'uploadInventory,fieldHealth,healthReadSucceeded,rows,addressMap,vrm,now,cameraCheckedAt),','uploadInventory,fieldHealth,healthReadSucceeded,rows,addressMap,vrm,now,cameraCheckedAt,inventoryReadSucceeded),')
          s=replace_once(s,'[uploadInventory,fieldHealth,healthReadSucceeded,rows,addressMap,vrm,now,cameraCheckedAt]);','[uploadInventory,fieldHealth,healthReadSucceeded,inventoryReadSucceeded,rows,addressMap,vrm,now,cameraCheckedAt]);')
          p.write_text(s)
          p=root/'src/refreshCadence.ts';s=p.read_text()
          s+='\n// Power observations expire independently of camera reads. This interval reads\n// only COS\'s saved VRM snapshot; vendor polling and device settings do not change.\nexport const POWER_SAVED_REFRESH_MS=4*60*1000;\n'
          p.write_text(s)
          p=root/'src/FleetDashboard.tsx';s=p.read_text()
          s=replace_once(s,"import {automaticRefreshDue} from './refreshCadence';", "import {automaticRefreshDue,POWER_SAVED_REFRESH_MS} from './refreshCadence';\nimport {cameraTimestamp} from './cameraEvidence';")
          s=replace_once(s,'lastSourceRead=useRef(0),running=useRef(false)', 'lastSourceRead=useRef(0),lastPowerRead=useRef(0),running=useRef(false)')
          s=replace_once(s,'const sources=useCallback(async()=>{if(running.current||!valid.current)return;running.current=true;lastSourceRead.current=Date.now();', 'const sources=useCallback(async(powerOnly=false)=>{if(running.current||!valid.current)return;running.current=true;if(!powerOnly)lastSourceRead.current=Date.now();lastPowerRead.current=Date.now();')
          s=replace_once(s,"const specs=[['routers',()=>api.get('/api/routers')],...(!fleetVrmReadAllowed(session)?[]:", "const specs=[...(!powerOnly?[[\"routers\",()=>api.get('/api/routers')]]:[]),...(!fleetVrmReadAllowed(session)?[]:")
          s=replace_once(s,'const tick=()=>{setClock(new Date());if(automaticRefreshDue(lastSourceRead.current,Date.now(),document.hidden))void sources();};','const tick=()=>{setClock(new Date());if(automaticRefreshDue(lastSourceRead.current,Date.now(),document.hidden)){void sources();void readMap();}else if(fleetVrmReadAllowed(session)&&automaticRefreshDue(lastPowerRead.current,Date.now(),document.hidden,POWER_SAVED_REFRESH_MS)){void sources(true);void readMap();}};')
          s=replace_once(s,'healthReadSucceeded={Boolean(cameras.data)&&!failed} rows={rows}','healthReadSucceeded={Boolean(cameras.data)&&!failed} inventoryReadSucceeded={Boolean(map)&&!mapError&&!recorded.error&&cameraTimestamp(map?.generatedAt,cameras.now).fresh} rows={rows}')
          s=replace_once(s,'router and power reads remain every 15 minutes. Provider polling schedules are unchanged.','router reads remain every 15 minutes and saved power reads every 4 minutes. Provider polling schedules are unchanged.')
          p.write_text(s)
          p=root/'tests/fleet-command-center.test.mjs';s=p.read_text()
          s=replace_once(s,"customer:placement==='SHOP'?'Cameras Onsite':'Customer '+i,uploadLifecycle:'UNFLAGGED',", "customer:placement==='SHOP'?'Cameras Onsite':'Customer '+i,uploadLifecycle:'UNFLAGGED',\n  ...(i===3?{binding:{state:'linked',unitIds:['11111111-1111-1111-1111-111111111111'],candidateUnitIds:[],placementHeld:false}}:{}),")
          s=replace_once(s,'const rows=[{id:uid,power:', "const rows=[{id:uid,placement:'field',retired:false,support:false,power:")
          p.write_text(s)
          print('Prepared only the reviewed five existing files; no database, identity, provider or credential mutations.')
          PY
          git diff --check
      - name: Install pinned dependencies
        working-directory: tech-checks/operations
        run: npm ci --no-audit --no-fund
      - name: Verify exact power guards and reconciled Field models
        working-directory: tech-checks/operations
        run: node --import tsx --test tests/fleet-independent-power.test.mjs tests/fleet-command-center.test.mjs tests/mhelp-provider-fleet.test.mjs tests/mhelp-field-health.test.mjs tests/fleet-dashboard.test.mjs
      - name: Strict TypeScript and production build
        working-directory: tech-checks/operations
        run: npm run typecheck && npm run build
      - name: Install browser
        working-directory: tech-checks/operations
        run: npx playwright install --with-deps chromium
      - name: Verify actual Fleet desktop and mobile integration
        working-directory: tech-checks/operations
        run: npm run test:browser -- tests/fleet-command-center.browser.spec.mjs tests/fleet-dashboard.browser.spec.mjs tests/fleet-refresh.browser.spec.mjs
      - name: Commit tested source changes only to the isolated repair branch
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/cos-independent-victron-evidence-20261020'
          test "$GITHUB_REF" = "refs/heads/$branch"
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git restore tech-checks/operations/dist
          git add tech-checks/operations/src/fleetCommandCenterModel.ts tech-checks/operations/src/FleetCommandCenter.tsx tech-checks/operations/src/FleetDashboard.tsx tech-checks/operations/src/refreshCadence.ts tech-checks/operations/tests/fleet-command-center.test.mjs
          git rm .github/workflows/prepare-cos-independent-power-20261020.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate tested independent power evidence and four-minute saved reads'
          git push origin "HEAD:refs/heads/$branch"
          echo "TESTED_CANDIDATE_HEAD=$(git rev-parse HEAD)"
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-independent-power-browser-evidence
          path: |
            tech-checks/operations/test-results
            tech-checks/operations/playwright-report
          if-no-files-found: ignore
