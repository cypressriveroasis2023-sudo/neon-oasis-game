name: Verify Tech Check TV
on:
  push:
    branches: [verify/tech-check-tv-smoke]
permissions:
  contents: read
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- tests/tech-check-tv.browser.spec.mjs tests/company-platform.browser.spec.mjs tests/delivery-go-back.browser.spec.mjs tests/mhelp-native-board.browser.spec.mjs tests/operations.browser.spec.mjs tests/owner-controls.browser.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tech-check-tv-results
          path: |
            tech-checks/operations/test-results
            tech-checks/operations/playwright-report
          if-no-files-found: ignore
