name: COS combined Fleet release verification
on:
  push:
    branches: [fix/fleet-verification-progress-20261104]
    paths:
      - '.github/workflows/cos-fleet-release-20261104.yml'
permissions:
  contents: write
concurrency:
  group: cos-fleet-combined-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fleet-verification-progress-20261104
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Combine reviewed reopening repair and prepare scheduled reader
        run: |
          git config user.name 'COS repair verification'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-edit 3a3667023b70e65983520d5ce016a62720fb56d5
          node .github/scripts/prepare-scheduled-publisher-repair.mjs
          node .github/scripts/finalize-fleet-reading-20261104.mjs
          mkdir -p repair-evidence/combined
      - name: Install locked dependencies
        working-directory: tech-checks/operations
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify scheduled source and exact backend protections
        working-directory: tech-checks/operations
        run: |
          set -o pipefail
          files='tests/fleet-scheduled-reader.test.mjs tests/fleet-scheduled-publisher.test.mjs tests/fleet-backend-provenance.spec.mjs tests/fleet-source-provenance.test.mjs tests/fleet-verification-progress.test.mjs tests/fleet-verification-reasons.test.mjs tests/exact-product-connection.test.mjs tests/saved-fleet-reading.test.mjs'
          for file in $files; do test -f "$file" || exit 1; done
          node --import tsx --test $files > ../../repair-evidence/combined/targeted-tests.txt 2>&1
      - name: Preserve tested source candidate
        run: |
          git add tech-checks/docs/fleet-scheduled-repair-20261104 tech-checks/operations/tests/fleet-scheduled-publisher.test.mjs tech-checks/operations/src/FleetDashboard.tsx tech-checks/operations/tests/fleet-count-retention.browser.spec.mjs tech-checks/operations/tests/fleet-verify-now.browser.spec.mjs tech-checks/operations/tests/fleet-dashboard-fixtures.mjs repair-evidence/combined
          git diff --cached --quiet || git commit -m 'Record tested scheduled reader and provider-independent count persistence'
          git push origin HEAD:fix/fleet-verification-progress-20261104
      - name: Typecheck and build combined application
        working-directory: tech-checks/operations
        run: |
          set +e
          npm run typecheck > ../../repair-evidence/combined/typecheck.txt 2>&1
          types=$?
          npm run build > ../../repair-evidence/combined/build.txt 2>&1
          build=$?
          printf '{"typecheck":%s,"build":%s}\n' "$types" "$build" > ../../repair-evidence/combined/build-results.json
          test "$types" = 0 && test "$build" = 0
      - name: Install project browser
        working-directory: tech-checks/operations
        run: npx playwright install --with-deps chromium
      - name: Verify combined browser behavior
        working-directory: tech-checks/operations
        run: |
          set +e
          npm run test:browser -- --workers=2 --retries=0 tests/fleet-verify-now.browser.spec.mjs tests/durable-fleet-board.browser.spec.mjs tests/fleet-count-retention.browser.spec.mjs > ../../repair-evidence/combined/browser-tests.txt 2>&1
          result=$?
          printf '{"browserTests":%s}\n' "$result" > ../../repair-evidence/combined/browser-results.json
          exit "$result"
      - name: Compare full unit suite with unchanged production source
        working-directory: tech-checks/operations
        run: |
          set +e
          npm test > ../../repair-evidence/combined/all-unit-tests.txt 2>&1
          candidate=$?
          baseline=0
          if [ "$candidate" != 0 ]; then
            git worktree add --detach /tmp/cos-main-baseline 1ddb5df2228d1a584393884182406bca90efd1d8
            ln -s "$PWD/node_modules" /tmp/cos-main-baseline/tech-checks/operations/node_modules
            (cd /tmp/cos-main-baseline/tech-checks/operations && npm test) > ../../repair-evidence/combined/baseline-unit-tests.txt 2>&1
            baseline=$?
          fi
          printf '{"candidate":%s,"baseline":%s}\n' "$candidate" "$baseline" > ../../repair-evidence/combined/full-unit-results.json
          if [ "$candidate" != 0 ]; then echo '::warning::Full suite has failures; compare candidate with baseline before release.'; fi
          exit 0
      - name: Commit exact browser-tested static bundle
        run: |
          git add tech-checks/operations/dist repair-evidence/combined
          git diff --cached --quiet || git commit -m 'Build browser-verified combined Fleet frontend; retain full-suite comparison'
          git push origin HEAD:fix/fleet-verification-progress-20261104
      - name: Preserve failure evidence without publishing an unverified bundle
        if: failure()
        run: |
          git add repair-evidence/combined
          git diff --cached --quiet || git commit -m 'Record combined Fleet verification failure; no release bundle published'
          git push origin HEAD:fix/fleet-verification-progress-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cos-combined-fleet-evidence
          path: |
            repair-evidence/combined
            tech-checks/operations/test-results
          retention-days: 3
      - name: Archive exact reviewed source
        if: always()
        run: git archive --format=zip HEAD -o /tmp/cos-combined-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cos-combined-source
          path: /tmp/cos-combined-source.zip
          retention-days: 3
