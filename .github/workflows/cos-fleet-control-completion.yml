name: Verify COS Fleet control completion
on:
  push:
    branches: [feature/cos-fleet-control-completion-20261019]
  pull_request:
    paths:
      - 'tech-checks/supabase/functions/cos-operational-sheets-sync/**'
      - 'tech-checks/supabase/functions/cos-fleet-control/**'
      - 'tech-checks/operations/tests/fleet-control*'
      - 'tech-checks/operations/db/cos-fleet-control*'
      - '.github/workflows/cos-fleet-control-completion.yml'
permissions:
  contents: read
concurrency:
  group: cos-fleet-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tech-checks/operations
      - name: Verify actual Google wire normalization
        working-directory: tech-checks/operations
        run: node --import tsx --test tests/fleet-control*.test.mjs
      - name: Verify immutable transfer SQL, worker and identity models
        run: |
          mkdir -p /tmp/cos-reviewed-transfer
          git archive 3aa6aa3e8c2ef44d1e7c658bb2f4d9be43c96ccd | tar -x -C /tmp/cos-reviewed-transfer
          ln -s "$GITHUB_WORKSPACE/tech-checks/operations/node_modules" /tmp/cos-reviewed-transfer/tech-checks/operations/node_modules
          cd /tmp/cos-reviewed-transfer/tech-checks/operations
          node --import tsx --test --test-concurrency=1 tests/operational-*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Strictly check deployable scheduled runtime
        working-directory: tech-checks/supabase/functions/cos-operational-sheets-sync
        run: deno check serve.ts
      - name: Typecheck existing COS frontend
        run: npm run typecheck
        working-directory: tech-checks/operations
      - name: Build existing COS frontend
        run: npm run build
        working-directory: tech-checks/operations
