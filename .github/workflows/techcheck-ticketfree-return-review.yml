name: TechCheck ticket-free truck return review
on:
  push:
    branches: ['feature/cos-ticketfree-truck-return-20261019']
  pull_request:
    paths:
      - 'tech-checks/ticketfree-returns/**'
      - 'tech-checks/service-basics-host.js'
      - 'tech-checks/database-maintenance/techcheck-ticketfree-returns-v1.sql'
      - 'tech-checks/operations/tests/ticketfree-return*'
      - '.github/workflows/techcheck-ticketfree-return-review.yml'
permissions:
  contents: read
jobs:
  returns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture exact reviewed source, not credentials or runtime data
        run: |
          mkdir -p /tmp/cos-source
          git ls-files -z tech-checks .github/workflows | tar --null -T - -czf /tmp/cos-source/source.tar.gz
          git rev-parse HEAD > /tmp/cos-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ticketfree-return-source
          path: /tmp/cos-source
          retention-days: 2
      - name: Install locked review dependencies
        run: npm ci
        working-directory: tech-checks/operations
      - name: Require implemented return tests
        run: node --import tsx --test tests/ticketfree-returns-sql.test.mjs tests/ticketfree-returns-client.test.mjs
        working-directory: tech-checks/operations
      - name: Verify new UI syntax
        run: node --check tech-checks/ticketfree-returns/host.js
      - name: Preserve Operations types and build
        run: npm run typecheck && npm run build
        working-directory: tech-checks/operations
