name: TechCheck ticket-free truck return review
on:
  push:
    branches: ['feature/cos-ticketfree-truck-return-20261019']
  pull_request:
    paths:
      - 'tech-checks/ticketfree-returns/**'
      - 'tech-checks/service-basics-host.js'
      - 'tech-checks/database-maintenance/techcheck-ticketfree-returns-v1.sql'
      - 'tech-checks/operations/tests/ticketfree-return*'
      - 'tech-checks/operations/tests/playwright.ticketfree.config.mjs'
      - 'tech-checks/operations/tests/service-basics.browser.spec.mjs'
      - '.github/workflows/techcheck-ticketfree-return-review.yml'
permissions:
  contents: read
jobs:
  returns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - name: Install locked review dependencies
        run: npm ci
        working-directory: tech-checks/operations
      - name: Ticket-free PostgreSQL transactions and client isolation
        run: node --import tsx --test tests/ticketfree-returns-sql.test.mjs tests/ticketfree-returns-client.test.mjs
        working-directory: tech-checks/operations
      - name: Preserve signed handoffs and Service daily evidence
        run: node --import tsx --test --test-concurrency=1 tests/transfer-core.test.mjs tests/transfer-readiness.test.mjs tests/transfer-rollout-sql.test.mjs tests/transfer-integration.test.mjs tests/service-daily-report-sql.test.mjs tests/service-daily-delivery.test.mjs tests/it-daily-availability.test.mjs tests/it-daily-camera.test.mjs
        working-directory: tech-checks/operations
      - name: Verify new UI syntax
        run: node --check tech-checks/ticketfree-returns/host.js
      - name: Preserve Operations types and build
        run: npm run typecheck && npm run build
        working-directory: tech-checks/operations
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tech-checks/operations
      - name: Service, IT receipt and named-handoff phone regressions
        run: npx playwright test --config tests/playwright.ticketfree.config.mjs
        working-directory: tech-checks/operations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticketfree-phone-evidence
          path: tech-checks/operations/test-results-ticketfree
          if-no-files-found: ignore
          retention-days: 7
