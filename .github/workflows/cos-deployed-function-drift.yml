# Detects hand-deployments of edge functions that were not recorded in version control.
# Deliberately NOT triggered on push or pull_request: it reads live platform state
# rather than the commit under test, so gating unrelated work on it would be wrong.
name: Deployed function drift
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare deployed function against the reviewed record
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The script reports VERIFIED(0), DRIFT(1), INCONCLUSIVE(2) and SKIPPED(3)
        # as distinct states, because "nothing was checked" must never read as a
        # pass. Severity is decided here: drift and read failures fail the job;
        # a missing credential is surfaced as a warning rather than a daily red
        # build, since the check can legitimately land before the secret exists.
        run: |
          set +e
          node .github/scripts/verify-deployed-function-digest.mjs
          status=$?
          set -e
          case "$status" in
            0) exit 0 ;;
            3) echo "::warning title=Drift check not operational::No SUPABASE_ACCESS_TOKEN is configured, so the deployed function was not verified. Add a read-only token to enable this check." ; exit 0 ;;
            *) exit "$status" ;;
          esac
