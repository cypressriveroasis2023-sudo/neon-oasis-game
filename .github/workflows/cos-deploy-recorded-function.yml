# Deploys a reviewed patch of the RECORDED cos-operations-pages artifact.
#
# Manual trigger only, never on push or pull_request. It deploys the recorded
# v134 bytes under tech-checks/docs/deployed-cos-operations-pages-v134/source
# plus one reviewed patch file from .github/function-patches, and refuses to run
# unless every recorded and patched hash matches. It never deploys main's
# tech-checks/supabase/functions/cos-operations-pages directory, which is a
# different implementation from what is in production.
#
# Why this exists: the only other deployment route sends a 1 MB file inline
# through a connector call, which stalls. This route is repeatable, reviewable,
# and keeps the access token in a repository secret that no person or assistant
# has to handle in a chat.
name: Deploy recorded cos-operations-pages patch
on:
  workflow_dispatch:
    inputs:
      patch:
        description: 'Which reviewed patch to deploy'
        required: true
        type: choice
        options:
          - exact-origin-cors-a711192b
          - rollback-original-v134
          - business-screens-410-v168
          - rollback-business-410-to-v168
          - routers-without-addresses-v169
          - rollback-routers-without-addresses-to-v169
          - camera-routes-only-v16
          - rollback-to-v16-entry
          - troubleshoot-route-v17
          - rollback-to-v17-entry
          - camera-ports-v18
          - rollback-to-v18-entry
          - a-links-v19
          - rollback-to-v19-entry
          - vcc-moves-v20
          - rollback-to-v20-entry
          - morning-list-v21
          - rollback-to-v21-entry
          - down-needs-two-misses-v22
          - router-swap-v23
          - rollback-to-v23-entry
          - send-to-it-loop-v24
          - rollback-to-v24-entry
          - rollback-to-v22-entry
      confirm:
        description: 'Type the patch name again to confirm. Deploying changes production immediately.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cos-operations-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse unless the confirmation matches the chosen patch
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.patch }}" ]; then
            echo "::error::Confirmation '${{ inputs.confirm }}' does not match patch '${{ inputs.patch }}'. Nothing deployed."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Pin the reviewed v168 patch file
        if: inputs.patch == 'business-screens-410-v168'
        run: printf '%s  %s\n' 'bd5ae10de9860534ffbb8b586a36b8834189329e23ab955fa60b9d488c76f909' '.github/function-patches/cos-operations-pages/business-screens-410-v168.json' | sha256sum -c -
      - name: Pin the reviewed v168 rollback file
        if: inputs.patch == 'rollback-business-410-to-v168'
        run: printf '%s  %s\n' '2ef966757c72c203eee4b9cb93661b8052df30f3018045d841de3d72b72b6f0f' '.github/function-patches/cos-operations-pages/rollback-business-410-to-v168.json' | sha256sum -c -
      - name: Pin the routers address removal patch file
        if: inputs.patch == 'routers-without-addresses-v169'
        run: printf '%s  %s\n' '90a9bbdb3b5f00f2d2a2b879e3f8087a2aa0bd69232689e003717782a5f01e82' '.github/function-patches/cos-operations-pages/routers-without-addresses-v169.json' | sha256sum -c -
      - name: Pin the routers address removal rollback file
        if: inputs.patch == 'rollback-routers-without-addresses-to-v169'
        run: printf '%s  %s\n' '40c3d805bddcc8216399f8843abe3114680cc1ee2de9ef19dafa3d03f320ab21' '.github/function-patches/cos-operations-pages/rollback-routers-without-addresses-to-v169.json' | sha256sum -c -
      - name: Pin the unit camera route patch file
        if: inputs.patch == 'camera-routes-only-v16'
        run: printf '%s  %s\n' 'd2a9bd1525d6ed45004f41c60dfd8ee80a0fe840a6db5cebd702349c1eff9215' '.github/function-patches/cos-unit-camera-status/camera-routes-only-v16.json' | sha256sum -c -
      - name: Pin the unit camera route rollback file
        if: inputs.patch == 'rollback-to-v16-entry'
        run: printf '%s  %s\n' 'a59c119515b30ecdb6f4b2937f468eeb634d885407908eb73ec2306dfed8376e' '.github/function-patches/cos-unit-camera-status/rollback-to-v16-entry.json' | sha256sum -c -
      - name: Pin the troubleshoot route patch file
        if: inputs.patch == 'troubleshoot-route-v17'
        run: printf '%s  %s\n' 'd7d5ae3fcaf231903ec753e86dccc32c3d319ff4c86d1c5d43a6745019b3cc98' '.github/function-patches/cos-unit-camera-status/troubleshoot-route-v17.json' | sha256sum -c -
      - name: Pin the troubleshoot route rollback file
        if: inputs.patch == 'rollback-to-v17-entry'
        run: printf '%s  %s\n' 'afe33a3d7574e08bbe3ea2b34cc711dbfd6b9332c89a08a63e427b81011127b3' '.github/function-patches/cos-unit-camera-status/rollback-to-v17-entry.json' | sha256sum -c -
      - name: Pin the camera ports patch file
        if: inputs.patch == 'camera-ports-v18'
        run: printf '%s  %s\n' '911a0308d57dd0dad90173dd87466e2094fd73bb988ff90415a29df9d1c611fc' '.github/function-patches/cos-unit-camera-status/camera-ports-v18.json' | sha256sum -c -
      - name: Pin the camera ports rollback file
        if: inputs.patch == 'rollback-to-v18-entry'
        run: printf '%s  %s\n' 'c6db3dabbe276919df652dae544e3248f23b566028475a957da6072dd93eefe1' '.github/function-patches/cos-unit-camera-status/rollback-to-v18-entry.json' | sha256sum -c -
      - name: Pin the A# links patch file
        if: inputs.patch == 'a-links-v19'
        run: printf '%s  %s\n' '24d93c00d94e5e03343619d020518c032bd4932b8760020814c6f110dc7769bb' '.github/function-patches/cos-unit-camera-status/a-links-v19.json' | sha256sum -c -
      - name: Pin the A# links rollback file
        if: inputs.patch == 'rollback-to-v19-entry'
        run: printf '%s  %s\n' 'e9e011bfc614f80d29eeeeb848f88880689e84d622929ed7b7110b608d02227e' '.github/function-patches/cos-unit-camera-status/rollback-to-v19-entry.json' | sha256sum -c -
      - name: Pin the Moved in VCC patch file
        if: inputs.patch == 'vcc-moves-v20'
        run: printf '%s  %s\n' 'd9775a92830aff5406ef5306a9d81744172ae825ce3a183c9ab1c459d8e59d17' '.github/function-patches/cos-unit-camera-status/vcc-moves-v20.json' | sha256sum -c -
      - name: Pin the Moved in VCC rollback file
        if: inputs.patch == 'rollback-to-v20-entry'
        run: printf '%s  %s\n' '11df4e96b174a977e2aad611a9e96b4ffd85e07bc7669a25077e930a251a47d8' '.github/function-patches/cos-unit-camera-status/rollback-to-v20-entry.json' | sha256sum -c -
      - name: Pin the morning list patch file
        if: inputs.patch == 'morning-list-v21'
        run: printf '%s  %s\n' 'fe78f4b105f495737ccfb0f1bc5377290925131b7435656033bf9695845752bd' '.github/function-patches/cos-unit-camera-status/morning-list-v21.json' | sha256sum -c -
      - name: Pin the morning list rollback file
        if: inputs.patch == 'rollback-to-v21-entry'
        run: printf '%s  %s\n' 'd67ab47071364f4e6bb7d6551a1e92c291f361afbbc5719d52208f5e74280556' '.github/function-patches/cos-unit-camera-status/rollback-to-v21-entry.json' | sha256sum -c -
      - name: Pin the Down needs two misses patch file
        if: inputs.patch == 'down-needs-two-misses-v22'
        run: printf '%s  %s\n' '14a80be0992fbd5708866fc9aec97d322f45f598b8c3b0bc51fdb826d88662e9' '.github/function-patches/cos-unit-camera-status/down-needs-two-misses-v22.json' | sha256sum -c -
      - name: Pin the Down needs two misses rollback file
        if: inputs.patch == 'rollback-to-v22-entry'
        run: printf '%s  %s\n' 'b207b7e272989992f1a3fd37fbfaf4f6005191a3ee09a3dcb06d5e42959df8ac' '.github/function-patches/cos-unit-camera-status/rollback-to-v22-entry.json' | sha256sum -c -
      - name: Pin the router swap patch file
        if: inputs.patch == 'router-swap-v23'
        run: printf '%s  %s\n' '08db1b26039a9e0ba7a00e0b1c8ac70540b0649ac083be99e2f2a1f9467016cb' '.github/function-patches/cos-unit-camera-status/router-swap-v23.json' | sha256sum -c -
      - name: Pin the v23 rollback file
        if: inputs.patch == 'rollback-to-v23-entry'
        run: printf '%s  %s\n' '56c82cf4332095d5167396c24c335ac4a8cd4bf59a94a4ceab151890482a3bdb' '.github/function-patches/cos-unit-camera-status/rollback-to-v23-entry.json' | sha256sum -c -
      - name: Pin the Send to IT loop patch file
        if: inputs.patch == 'send-to-it-loop-v24'
        run: printf '%s  %s\n' '94992eeaceefe92cf461a4ca4ec891b440af1a3e093e8c9b8c9100c311e7bbb9' '.github/function-patches/cos-unit-camera-status/send-to-it-loop-v24.json' | sha256sum -c -
      - name: Pin the v24 rollback file
        if: inputs.patch == 'rollback-to-v24-entry'
        run: printf '%s  %s\n' 'b06bfb457977072dc8eb69bc403e655ba168cd23d98f7e09926b2d2e89879cf1' '.github/function-patches/cos-unit-camera-status/rollback-to-v24-entry.json' | sha256sum -c -
      - name: Pin the read-only live archive preflight
        run: printf '%s  %s\n' 'cf718bb9497b4e7ffe7af4dce2c23076cbcf59f2b39859cfa2a1def3e38be280' '.github/scripts/preflight-live-function-pins.mjs' | sha256sum -c -
      - name: Choose the recorded patch path
        id: recorded
        run: |
          name="${{ inputs.patch }}"
          case "$name" in
            camera-routes-only-v16|rollback-to-v16-entry|troubleshoot-route-v17|rollback-to-v17-entry|camera-ports-v18|rollback-to-v18-entry|a-links-v19|rollback-to-v19-entry|vcc-moves-v20|rollback-to-v20-entry|morning-list-v21|rollback-to-v21-entry|down-needs-two-misses-v22|rollback-to-v22-entry|router-swap-v23|rollback-to-v23-entry|send-to-it-loop-v24|rollback-to-v24-entry)
              echo "file=.github/function-patches/cos-unit-camera-status/${name}.json" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "file=.github/function-patches/cos-operations-pages/${name}.json" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show the read-only live archive pins
        run: node .github/scripts/preflight-live-function-pins.mjs
      - name: Unit-test the deploy script
        run: node --test .github/scripts/deploy-recorded-function.test.mjs .github/scripts/preflight-live-function-pins.test.mjs
      - name: Dry run (hashes only, no network)
        run: node .github/scripts/deploy-recorded-function.mjs "${{ steps.recorded.outputs.file }}" --dry-run
      - name: Deploy and verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          node .github/scripts/deploy-recorded-function.mjs "${{ steps.recorded.outputs.file }}" --deploy
          status=$?
          set -e
          case "$status" in
            0) exit 0 ;;
            3) echo "::error title=No deploy credential::SUPABASE_ACCESS_TOKEN is not configured as a repository secret, so nothing was deployed." ; exit 1 ;;
            2) echo "::error title=Inconclusive::The platform could not be read. If the deploy step printed 'Deploy accepted', verify the live function manually before trusting it." ; exit 2 ;;
            *) exit "$status" ;;
          esac
      - name: Keep the deployment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-${{ inputs.patch }}-${{ github.run_id }}
          path: deployment-record.json
          if-no-files-found: ignore
