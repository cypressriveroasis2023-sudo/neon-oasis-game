# Deploys a reviewed patch of the RECORDED cos-operations-pages artifact.
#
# Manual trigger only, never on push or pull_request. It deploys the recorded
# v134 bytes under tech-checks/docs/deployed-cos-operations-pages-v134/source
# plus one reviewed patch file from .github/function-patches, and refuses to run
# unless every recorded and patched hash matches. It never deploys main's
# tech-checks/supabase/functions/cos-operations-pages directory, which is a
# different implementation from what is in production.
#
# Why this exists: the only other deployment route sends a 1 MB file inline
# through a connector call, which stalls. This route is repeatable, reviewable,
# and keeps the access token in a repository secret that no person or assistant
# has to handle in a chat.
name: Deploy recorded cos-operations-pages patch
on:
  workflow_dispatch:
    inputs:
      patch:
        description: 'Which reviewed patch to deploy'
        required: true
        type: choice
        options:
          - exact-origin-cors-a711192b
          - rollback-original-v134
      confirm:
        description: 'Type the patch name again to confirm. Deploying changes production immediately.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cos-operations-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse unless the confirmation matches the chosen patch
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.patch }}" ]; then
            echo "::error::Confirmation '${{ inputs.confirm }}' does not match patch '${{ inputs.patch }}'. Nothing deployed."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit-test the deploy script
        run: node --test .github/scripts/deploy-recorded-function.test.mjs
      - name: Dry run (hashes only, no network)
        run: node .github/scripts/deploy-recorded-function.mjs ".github/function-patches/cos-operations-pages/${{ inputs.patch }}.json" --dry-run
      - name: Deploy and verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          node .github/scripts/deploy-recorded-function.mjs ".github/function-patches/cos-operations-pages/${{ inputs.patch }}.json" --deploy
          status=$?
          set -e
          case "$status" in
            0) exit 0 ;;
            3) echo "::error title=No deploy credential::SUPABASE_ACCESS_TOKEN is not configured as a repository secret, so nothing was deployed." ; exit 1 ;;
            2) echo "::error title=Inconclusive::The platform could not be read. If the deploy step printed 'Deploy accepted', verify the live function manually before trusting it." ; exit 2 ;;
            *) exit "$status" ;;
          esac
      - name: Keep the deployment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-${{ inputs.patch }}-${{ github.run_id }}
          path: deployment-record.json
          if-no-files-found: ignore
