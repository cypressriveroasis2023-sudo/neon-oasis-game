name: Deploy Cameras On Site

on:
  push:
    branches: [main]
    paths:
      - 'cameras-on-site/**'
      - '.github/workflows/deploy-cameras-on-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Cameras On Site app
        uses: actions/upload-pages-artifact@v3
        with:
          path: './cameras-on-site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# trigger deployment after workflow registration
