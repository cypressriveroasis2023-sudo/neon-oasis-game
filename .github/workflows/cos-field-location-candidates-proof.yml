name: Verify COS Field Location Candidate Audit
on:
  pull_request:
    paths:
      - 'tech-checks/operations/tests/helpers/field-saved-location-audit.mjs'
      - 'tech-checks/operations/tests/field-saved-location-audit.test.mjs'
      - 'tech-checks/operations/tests/cos-source-estimate-optional-holds.test.mjs'
      - 'tech-checks/operations/db/cos_source_estimate_optional_holds_20261017.sql'
      - '.github/workflows/cos-field-location-candidates-proof.yml'
permissions:
  contents: read
jobs:
  location-candidate-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test candidate-vs-accepted-pin safeguards
        run: |
          set -o pipefail
          node --no-wasm-code-gc --import tsx --test --test-concurrency=1 tests/field-saved-location-audit.test.mjs tests/cos-source-estimate-optional-holds.test.mjs | tee field-location-candidate-receipt.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cos-field-location-candidate-receipt
          path: tech-checks/operations/field-location-candidate-receipt.txt
