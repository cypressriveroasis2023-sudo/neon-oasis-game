name: Verify mHelp address cache lookup
on:
  pull_request:
    paths:
      - 'tech-checks/operations/db/mhelp-address-cache-lookup.sql'
      - 'tech-checks/operations/tests/mhelp-address-automation*'
      - 'tech-checks/operations/tests/fixtures/mhelp-address-cache-lookup.json'
      - 'tech-checks/operations/legacy/tests/mhelp-address-cache-postgres.ci.mjs'
      - '.github/workflows/mhelp-address-cache.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: cos_mhelp_intake_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cos_mhelp_intake_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify guarded address lookup migration in real PostgreSQL
        env:
          COS_MHELP_POSTGRES_CI: '1'
        run: node legacy/tests/mhelp-address-cache-postgres.ci.mjs
