name: Prepare COS PR312 runtime only
on:
  push:
    branches: [build/cos-pr312-runtime-20261026]
    paths: [.github/workflows/cos-pr312-runtime-only.yml]
permissions:
  contents: write
concurrency:
  group: cos-pr312-runtime-only-0444525
  cancel-in-progress: false
jobs:
  prepare-runtime:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COS_SOURCE_SHA: 0444525008291054665b35ffd359a78d4fd37325
    steps:
      - name: Check out only the already-tested repair source
        uses: actions/checkout@v4
        with:
          ref: 0444525008291054665b35ffd359a78d4fd37325
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - name: Confirm immutable source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COS_SOURCE_SHA"
          test "$(git rev-parse HEAD:tech-checks/operations/package-lock.json)" = 11a25561eb56277882935478aa91ec819c788529
      - name: Install exactly locked dependencies
        working-directory: tech-checks/operations
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build existing Operations
        working-directory: tech-checks/operations
        run: |
          npm run typecheck
          npm run build
      - name: Stage complete generated output locally, never push a branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- tech-checks/operations/package.json tech-checks/operations/package-lock.json
          git add -A -- tech-checks/operations/dist
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['diff','--cached','--name-only','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          assert(paths.length>0,'No artifact correction was required; do not publish another tree');
          assert(paths.length<250,'Unexpectedly broad output change');
          assert(paths.every(path=>path.startsWith('tech-checks/operations/dist/')),'Non-runtime change rejected');
          const unstaged=execFileSync('git',['diff','--name-only','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          assert.equal(unstaged.length,0,'Build changed files outside the staged runtime');
          console.log('Generated runtime changes:',paths.length);
          NODE
          git -c user.name='COS runtime verification' -c user.email='cos-runtime-verification@users.noreply.github.com' commit -m 'Build exact reviewed PR312 Operations runtime'
      - name: Rebuild and run the unchanged full artifact verifier
        working-directory: tech-checks/operations
        run: |
          npm run build
          node ../../.github/scripts/verify-cos-build-artifact.mjs
      - name: Store reviewed Git objects without advancing any reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync,lstatSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const repo='cypressriveroasis2023-sudo/neon-oasis-game';
          const source='0444525008291054665b35ffd359a78d4fd37325';
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.COS_SOURCE_SHA,source);
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:32*1024*1024}).trim();
          assert.equal(git('rev-parse','HEAD^'),source);
          const manifest=JSON.parse(readFileSync('cos-build-evidence/manifest.json','utf8'));
          assert.equal(manifest.commit,git('rev-parse','HEAD'));
          assert.equal(manifest.lockfileUnchanged,true);
          const prefix='tech-checks/operations/dist/';
          const files=execFileSync('git',['diff','--name-only','--no-renames','-z',source,'HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          assert(files.length>0&&files.length<250&&files.every(path=>path.startsWith(prefix)));
          const api=async(path,payload)=>{
            assert(['git/blobs','git/trees'].includes(path),'Only inert Git objects may be written');
            const response=await fetch('https://api.github.com/repos/'+repo+'/'+path,{
              method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
              body:JSON.stringify(payload),signal:AbortSignal.timeout(45000)
            });
            if(!response.ok)throw Error('Git object creation failed: '+response.status);
            return response.json();
          };
          const entries=[];
          for(const path of files){
            let stat;try{stat=lstatSync(path);}catch(error){if(error.code!=='ENOENT')throw error;entries.push({path,mode:'100644',type:'blob',sha:null});continue;}
            assert(stat.isFile()&&!stat.isSymbolicLink(),'Unsupported runtime file type');
            const bytes=readFileSync(path);
            assert(bytes.length<=8*1024*1024,'Unexpected runtime file size');
            const hash=createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex');
            const saved=await api('git/blobs',{encoding:'base64',content:bytes.toString('base64')});
            assert.equal(saved.sha,hash,'Saved runtime blob bytes changed');
            entries.push({path,mode:'100644',type:'blob',sha:saved.sha});
          }
          const stored=await api('git/trees',{base_tree:git('rev-parse',source+'^{tree}'),tree:entries});
          assert.equal(stored.sha,git('rev-parse','HEAD^{tree}'),'Stored tree differs from twice-built reviewed bytes');
          const proof={sourceCommit:source,preparedTree:stored.sha,localVerificationCommit:manifest.commit,changedFiles:files,lockfileSha256:manifest.lockfileSha256,verifiedFileCount:manifest.files.length,branchesChanged:false,productionChanged:false};
          writeFileSync('cos-build-evidence/pr312-runtime-tree.json',JSON.stringify(proof,null,2)+'\n');
          console.log('COS_PR312_RUNTIME_TREE='+JSON.stringify(proof));
          NODE
      - name: Preserve reproducible build and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: cos-pr312-runtime-0444525
          path: |
            cos-build-evidence/manifest.json
            cos-build-evidence/pr312-runtime-tree.json
            tech-checks/operations/dist
          if-no-files-found: error
          retention-days: 14
