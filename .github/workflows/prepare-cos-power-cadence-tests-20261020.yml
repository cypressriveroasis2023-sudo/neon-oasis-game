name: Verify independent power cadence regressions
on:
  push:
    branches: [fix/cos-independent-victron-evidence-20261020]
    paths: ['.github/workflows/prepare-cos-power-cadence-tests-20261020.yml']
permissions:
  contents: write
jobs:
  verify-reviewed-cadence:
    if: github.ref == 'refs/heads/fix/cos-independent-victron-evidence-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update exact browser cadence expectations and extend the standing CI gate
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('tech-checks/operations/tests/saved-camera-refresh.browser.spec.mjs')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='4332254db2573db88ae746b49292c86d612c832d','Browser test changed concurrently'
          s=p.read_text()
          def once(text,old,new):
           assert text.count(old)==1,f'Unexpected anchor: {old[:100]}'
           return text.replace(old,new,1)
          s=once(s,'four-minute saved reads see the next producer result before old evidence expires; other feeds stay fifteen minutes','four-minute camera and saved power reads see new evidence; routers remain fifteen minutes')
          for old,new in [('health:2,map:2,routers:1,power:1','health:2,map:2,routers:1,power:2'),('health:3,map:3,routers:1,power:1','health:3,map:3,routers:1,power:3'),('health:4,map:4,routers:1,power:1','health:4,map:4,routers:1,power:4')]:s=once(s,old,new)
          s=once(s,'await page.clock.runFor(180000);await expect.poll(()=>counts(state)).toEqual({health:4,map:4,routers:2,power:2});','await page.clock.runFor(180000);await expect.poll(()=>counts(state)).toEqual({health:4,map:4,routers:2,power:5});')
          s=once(s,'await expect.poll(()=>counts(state)).toEqual({health:4,map:4,routers:2,power:2});','await expect.poll(()=>counts(state)).toEqual({health:4,map:4,routers:2,power:4});')
          p.write_text(s)
          p=Path('.github/workflows/verify-cos-fleet-command-center.yml')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='b23018c53738219b5fa3f381ba65bb1a079749c1','Standing verification workflow changed concurrently'
          s=p.read_text()
          s=once(s,"      - 'tech-checks/operations/src/fleetCommandCenterModel.ts'", "      - 'tech-checks/operations/src/fleetCommandCenterModel.ts'\n      - 'tech-checks/operations/src/fleetPowerVerification.ts'\n      - 'tech-checks/operations/src/refreshCadence.ts'\n      - 'tech-checks/operations/tests/fleet-independent-power.test.mjs'\n      - 'tech-checks/operations/tests/saved-camera-refresh.browser.spec.mjs'")
          s=once(s,'            tests/fleet-command-center.test.mjs \\', '            tests/fleet-command-center.test.mjs \\\n            tests/fleet-independent-power.test.mjs \\')
          s=once(s,'run: npm run test:browser -- tests/fleet-command-center.browser.spec.mjs tests/fleet-dashboard.browser.spec.mjs', 'run: npm run test:browser -- tests/fleet-command-center.browser.spec.mjs tests/fleet-dashboard.browser.spec.mjs tests/saved-camera-refresh.browser.spec.mjs')
          p.write_text(s)
          PY
          git diff --check
      - name: Install and verify source
        working-directory: tech-checks/operations
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          node --import tsx --test tests/fleet-independent-power.test.mjs tests/fleet-command-center.test.mjs tests/mhelp-provider-fleet.test.mjs tests/mhelp-field-health.test.mjs tests/fleet-dashboard.test.mjs tests/refresh-cadence.test.mjs tests/saved-camera-refresh-scheduling.test.mjs
          npm run build
          npx playwright install --with-deps chromium
      - name: Verify actual Fleet and hidden-tab refresh behavior
        working-directory: tech-checks/operations
        run: npm run test:browser -- tests/fleet-command-center.browser.spec.mjs tests/fleet-dashboard.browser.spec.mjs tests/saved-camera-refresh.browser.spec.mjs
      - name: Commit only passing tests and standing CI coverage on this branch
        run: |
          set -euo pipefail
          branch='fix/cos-independent-victron-evidence-20261020'
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git restore tech-checks/operations/dist
          git add tech-checks/operations/tests/saved-camera-refresh.browser.spec.mjs .github/workflows/verify-cos-fleet-command-center.yml
          git rm .github/workflows/prepare-cos-power-cadence-tests-20261020.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify four-minute saved power reads, 15-minute routers and unchanged camera timing'
          git push origin "HEAD:refs/heads/$branch"
          echo "TESTED_CANDIDATE_HEAD=$(git rev-parse HEAD)"
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-independent-power-cadence-evidence
          path: |
            tech-checks/operations/test-results
            tech-checks/operations/playwright-report
          if-no-files-found: ignore
