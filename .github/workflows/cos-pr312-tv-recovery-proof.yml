name: Verify COS exact TCP display fixtures
on:
  push:
    branches: [build/cos-pr312-runtime-20261026]
    paths: [.github/workflows/cos-pr312-tv-recovery-proof.yml]
permissions:
  contents: read
concurrency:
  group: cos-pr312-tv-recovery-6192d22
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6192d22bb8b2c7f9554c101bbf960ba538d0a143
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - name: Install exact locked tools and pinned browser
        working-directory: tech-checks/operations
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Apply only independent synthetic fixtures and clock scheduling correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6192d22bb8b2c7f9554c101bbf960ba538d0a143
          python3 <<'PY'
          from pathlib import Path
          root=Path('tech-checks/operations/tests')
          p=root/'fixtures/fleet-status-pins-fixture.mjs'
          s=p.read_text()
          before="import {fieldProductFixture} from './mhelp-field-health-fixtures.mjs';"
          assert s.count(before)==1
          s=s.replace(before,"import {fieldProductFixture,fieldProductConnectionFixture} from './mhelp-field-health-fixtures.mjs';")
          assert s.count(' return f;')==1
          s=s.replace(' return f;'," // Reconcile the independently mocked TCP receipt with the enlarged Product-ID census.\n f.connections=fieldProductConnectionFixture(f.upload,f.fresh);\n return f;")
          p.write_text(s)
          for name,label in [('fleet-map-groups.browser.spec.mjs','f'),('fleet-status-pins.browser.spec.mjs','fixture')]:
              p=root/name;s=p.read_text()
              before='{field:'+label+'.field,health:'+label+'.health}'
              assert s.count(before)==(3 if label=='f' else 2)
              s=s.replace(before,'{field:'+label+'.field,health:'+label+'.health,productConnections:'+label+'.connections}')
              p.write_text(s)
          p=root/'tech-check-tv.browser.spec.mjs';s=p.read_text()
          before=" state.fleetFailures={};state.cameraRows=f.health.rows.map(row=>({...row,evidence:{...row.evidence,observedAt:new Date(Date.parse(time)+18*60000).toISOString()}}));\n await page.clock.runFor(15*60000);\n await expect(summary).toContainText('7 Field equipment');await expect(summary).toContainText('1 offline');"
          after=" state.fleetFailures={};state.cameraRows=f.health.rows.map(row=>({...row,evidence:{...row.evidence,observedAt:new Date(Date.parse(time)+18*60000).toISOString()}}));\n // Keep the real network's bounded timeout on real time at the scheduled\n // recovery boundary; a 15-minute virtual jump can otherwise outrun I/O.\n const firstFleetRead=state.fleetRequests.find(r=>r.path==='/api/field-map').at;\n const scheduledRecovery=firstFleetRead+2*15*60000;\n const untilRecovery=scheduledRecovery-await page.evaluate(()=>Date.now());\n expect(untilRecovery).toBeGreaterThan(1000);\n await page.clock.runFor(untilRecovery-1000);\n await page.clock.resume();\n await expect(summary).toContainText('7 Field equipment');await expect(summary).toContainText('1 offline');\n const recoveredAt=await page.evaluate(()=>Date.now());\n expect(recoveredAt).toBeGreaterThanOrEqual(scheduledRecovery-1000);\n await page.clock.pauseAt(new Date(recoveredAt+1000));\n await page.clock.runFor(2*60000);\n await expect(summary).toContainText('1 offline');"
          assert s.count(before)==1;p.write_text(s.replace(before,after))
          PY
          test "$(git diff --name-only | wc -l)" = 4
          git diff --exit-code -- tech-checks/operations/src tech-checks/operations/dist tech-checks/supabase tech-checks/operations/package-lock.json
      - name: Verify only previously failing map colors and scheduled TV recovery
        working-directory: tech-checks/operations
        run: |
          set -euo pipefail
          npm run test:browser -- --workers=2 --retries=0 tests/tech-check-tv.browser.spec.mjs tests/fleet-map-groups.browser.spec.mjs tests/fleet-status-pins.browser.spec.mjs --grep 'dense Fleet switches|Fleet status pin colors|Offline Fleet filter|TV headline and outage cards use the same complete Field Product IDs through failure and retry' | tee ../../tv-recovery-result.log
      - name: Preserve exact fixture corrections and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-pr312-tcp-fixture-corrections-6192d22
          path: |
            tech-checks/tv-recovery-result.log
            tech-checks/operations/tests/fixtures/fleet-status-pins-fixture.mjs
            tech-checks/operations/tests/fleet-map-groups.browser.spec.mjs
            tech-checks/operations/tests/fleet-status-pins.browser.spec.mjs
            tech-checks/operations/tests/tech-check-tv.browser.spec.mjs
            tech-checks/operations/test-results
            tech-checks/operations/playwright-report
          retention-days: 3
          if-no-files-found: error
