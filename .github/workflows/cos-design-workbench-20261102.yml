# Candidate-only test adaptations. Never update a ref or deploy from CI.
name: COS design shell regressions (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.validated.outputs.ready }}
    defaults:
      run: {shell: bash, working-directory: tech-checks/operations}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Preserve all application and camera repair code; adapt only reviewed tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code c8d2bbc4348ec94dd44e9edd1e01d92e5fa307f3 HEAD -- src dist ../supabase ../app.js ../operations-host.js package.json package-lock.json
          mkdir -p ../../cos-shell-candidate/stage
          printf '%s\n' "$GITHUB_SHA" > ../../cos-shell-candidate/source-sha.txt
          node tests/approved-shell-test-source.mjs apply
          node tests/approved-shell-test-source.mjs check
          git diff -- tests > ../../cos-shell-candidate/test-adaptations.patch
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused preservation navigation Board Fleet Tech Check and Team checks
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs tests/approved-board-actions.test.mjs tests/approved-tech-checks.test.mjs tests/approved-team-job-links.test.mjs 2>&1 | tee ../../cos-shell-candidate/unit.log
      - name: Full typecheck and unchanged authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-shell-candidate/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-shell-candidate/auth.log
      - name: Complete build and original unchanged compiled-artifact verification
        run: |
          npm run build 2>&1 | tee ../../cos-shell-candidate/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-shell-candidate/artifact-gate.log
          git diff --exit-code HEAD -- src dist package.json package-lock.json
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Complete adapted shell suites and current navigation integration
        run: npm run test:browser -- tests/company-theme.browser.spec.mjs tests/company-overview.browser.spec.mjs tests/responsive-host.browser.spec.mjs tests/approved-layout.browser.spec.mjs tests/approved-workspace-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-shell-candidate/browser.log
      - name: Stage only reviewed test source after all validations pass
        id: validated
        run: |
          node tests/approved-shell-test-source.mjs check
          node --input-type=module <<'NODE'
          import {hashes} from './tests/approved-shell-test-source.mjs';
          import {readFileSync,writeFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const entries=[];
          for(const [file,[,sha]]of Object.entries(hashes)){
            const bytes=readFileSync('tests/'+file);if(createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex')!==sha)throw Error(file);
            writeFileSync('../../cos-shell-candidate/stage/'+sha,bytes);entries.push({path:'tech-checks/operations/tests/'+file,sha,sha256:createHash('sha256').update(bytes).digest('hex')});
          }
          writeFileSync('../../cos-shell-candidate/manifest.json',JSON.stringify({source:process.env.GITHUB_SHA,entries},null,2));
          NODE
          echo 'ready=yes' >> "$GITHUB_OUTPUT"
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-shell-candidate-${{ github.sha }}
          path: |
            cos-shell-candidate/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
  stage-blobs:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.ready == 'yes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cos-shell-candidate-${{ github.sha }}
          path: evidence
      - name: Create only four verified inert Git blobs; never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('evidence/cos-shell-candidate');m=json.loads((root/'manifest.json').read_text())
          assert m['source']==os.environ['GITHUB_SHA'] and len(m['entries'])==4
          allowed={'company-theme.browser.spec.mjs','company-overview.browser.spec.mjs','responsive-host.browser.spec.mjs','approved-layout.browser.spec.mjs'}
          assert {pathlib.PurePosixPath(e['path']).name for e in m['entries']}==allowed
          result=[]
          for e in m['entries']:
            assert e['path']=='tech-checks/operations/tests/'+pathlib.PurePosixPath(e['path']).name
            b=(root/'stage'/e['sha']).read_bytes()
            assert hashlib.sha256(b).hexdigest()==e['sha256'] and hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()==e['sha']
            req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(b).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req) as r: reply=json.load(r)
            assert reply['sha']==e['sha'];result.append(e)
          pathlib.Path('receipt.json').write_text(json.dumps({'source':m['source'],'entries':result},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'cos-shell-blob-receipt-${{ github.sha }}', path: receipt.json, retention-days: 7}
