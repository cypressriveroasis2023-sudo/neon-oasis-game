# Candidate validation only. No ref writes, merge, live data, or deployment.
name: COS design Board unit navigation (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.validated.outputs.ready }}
    defaults:
      run: {shell: bash, working-directory: tech-checks/operations}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify exact candidate and unchanged protected runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code cb5d5c7c7abdf93afdb0d30e2449a7857a49a144 HEAD -- .
          git diff --exit-code b9d8a728f9212b204603f9a9ae5b46ed34e26973 HEAD -- src ':!src/BoardRecordDetails.tsx' ':!src/ApprovedBoardUnitLink.tsx' ':!src/approvedBoardUnitLink.ts' ../supabase ../app.js ../operations-host.js package.json package-lock.json proposals
          mkdir -p ../../cos-unit-link-candidate/stage
          printf '%s\n' "$GITHUB_SHA" > ../../cos-unit-link-candidate/source-sha.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const hashes={'src/BoardRecordDetails.tsx':'c2beb901bc364be020967922eb8932e768279a0910909f3c8902eb445501feaa','src/ApprovedBoardUnitLink.tsx':'eb728d229238a670361ef68b997454148f4c76bedbdc7e10dbeaf38c077b917b','src/approvedBoardUnitLink.ts':'bff69bce207c2038ceef6d8dbed3f003bc202aa52711016fa8e34b734a7e8a73','tests/approved-board-unit-link.test.mjs':'2addbc7c4418049fed90bda7a6b3e6a9bd2a0acb95b7d356201dc0e57002afc9','tests/approved-board-unit-link.browser.spec.mjs':'4300192d5ce37840308cb7eda6c3dea2ca44ac87e7f8d0f2cc7bc8de407e0189'};
          for(const [file,hash]of Object.entries(hashes))if(createHash('sha256').update(readFileSync(file)).digest('hex')!==hash)throw Error('Candidate mismatch: '+file);
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original source-preservation and exact link tests
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs tests/approved-board-actions.test.mjs tests/approved-tech-checks.test.mjs tests/approved-team-job-links.test.mjs tests/approved-board-unit-link.test.mjs proposals/board-unit-link/*.test.mjs 2>&1 | tee ../../cos-unit-link-candidate/unit.log
      - name: Full typecheck and original authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-unit-link-candidate/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-unit-link-candidate/auth.log
      - name: Complete application build and independent compiled hash checks
        run: |
          npm run build 2>&1 | tee ../../cos-unit-link-candidate/build.log
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const expected={'dist/index.html':['512a628f33e48588ce06882c4b0ebef0a7621d641162da8df60779e0e1da021a','56c61a365ad7ea2f44dbfdb075f794e5c9a0243d'],'dist/assets/index-CzgQhNZv.js':['a930370da5680bb736b5e836ad0db666fb3425776ef18a846263a4a122267f97','4d2904de92bad5ae7d03bba81d9e04710e0707ca'],'dist/assets/index-TWJy31QV.css':['61a848d752688374e913ac807e9f68a391acfb6641b5ad93e5841b2697983416','e243bfc5d36690b0905648bc36e175c16f701ea8']};
          const entries=[];for(const [file,[digest,blob]]of Object.entries(expected)){const bytes=readFileSync(file);if(createHash('sha256').update(bytes).digest('hex')!==digest||createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex')!==blob)throw Error('Compiled mismatch: '+file);writeFileSync('../../cos-unit-link-candidate/stage/'+blob,bytes);entries.push({path:'tech-checks/operations/'+file,sha:blob,sha256:digest});}
          writeFileSync('../../cos-unit-link-candidate/manifest.json',JSON.stringify({source:process.env.GITHUB_SHA,entries},null,2));
          NODE
          git diff --exit-code HEAD -- src tests proposals package.json package-lock.json
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Board exact unit route original actions and Fleet evidence
        run: npm run test:browser -- tests/approved-board-unit-link.browser.spec.mjs tests/approved-board-actions.browser.spec.mjs tests/approved-fleet-unit.browser.spec.mjs tests/approved-workspace-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-unit-link-candidate/browser.log
      - name: Record successful candidate validation
        id: validated
        run: echo 'ready=yes' >> "$GITHUB_OUTPUT"
      - name: Original committed artifact gate before attachment (not waived)
        run: node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-unit-link-candidate/artifact-gate.log
      - name: Retain candidate evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-unit-link-candidate-${{ github.sha }}
          path: |
            cos-unit-link-candidate/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
  stage-blobs:
    needs: verify
    if: always() && needs.verify.outputs.ready == 'yes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'cos-unit-link-candidate-${{ github.sha }}', path: evidence}
      - name: Create three verified inert build objects only; no ref change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('evidence/cos-unit-link-candidate');m=json.loads((root/'manifest.json').read_text())
          expected={'tech-checks/operations/dist/index.html':'56c61a365ad7ea2f44dbfdb075f794e5c9a0243d','tech-checks/operations/dist/assets/index-CzgQhNZv.js':'4d2904de92bad5ae7d03bba81d9e04710e0707ca','tech-checks/operations/dist/assets/index-TWJy31QV.css':'e243bfc5d36690b0905648bc36e175c16f701ea8'}
          assert m['source']==os.environ['GITHUB_SHA'] and len(m['entries'])==3 and {e['path']:e['sha'] for e in m['entries']}==expected
          for e in m['entries']:
            b=(root/'stage'/e['sha']).read_bytes()
            assert hashlib.sha256(b).hexdigest()==e['sha256'] and hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()==e['sha']
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(b).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request) as response: result=json.load(response)
            assert result['sha']==e['sha']
          pathlib.Path('receipt.json').write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'cos-unit-link-blob-receipt-${{ github.sha }}', path: receipt.json, retention-days: 7}
