# Final exact-head read-only validation. No patching, staging, ref writes or deployment.
name: COS design Tech Check navigation (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {shell: bash, working-directory: tech-checks/operations}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify attached candidate and unchanged protected runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code 8cef8947db867ea1f68223dfd53cf14298f5dbe0 HEAD -- .
          git diff --exit-code 59839313718b7ee3044759bd0a9c5c34cea9c498 HEAD -- ../supabase ../app.js ../operations-host.js package.json package-lock.json
          git diff --exit-code 59839313718b7ee3044759bd0a9c5c34cea9c498 HEAD -- src ':!src/TechChecksWorkspace.tsx' ':!src/ApprovedCheckManagement.tsx' ':!src/approvedCheckManagement.css'
          mkdir -p ../../cos-check-final
          printf '%s\n' "$GITHUB_SHA" > ../../cos-check-final/source-sha.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const expected={'src/TechChecksWorkspace.tsx':'cd84a1291e8738f3afdba0a655cbb44c527e97165ae6c7888e7126bf3e27a161','src/ApprovedCheckManagement.tsx':'3d26da4925def6f251fb31289fe0fe77933820db11340a2331648ab51be460ef','src/approvedCheckManagement.css':'2b003761f259573e1210f3883d3a0ef289ad44fef38459073bc2762746e2170b','tests/tech-checks-navigation.browser.spec.mjs':'6a8b8d5a9632e192a06ace74554ce194314630a0ad04df409851504081aeae9e'};
          for(const [file,hash]of Object.entries(expected))if(createHash('sha256').update(readFileSync(file)).digest('hex')!==hash)throw Error('Attached candidate mismatch: '+file);
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused source-preservation navigation Board Fleet and Tech Check checks
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs tests/approved-board-actions.test.mjs tests/approved-tech-checks.test.mjs 2>&1 | tee ../../cos-check-final/unit.log
      - name: Full TypeScript check and original technician authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-check-final/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-check-final/auth.log
      - name: Complete application build and original unmodified artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-check-final/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-check-final/artifact-gate.log
          git diff --exit-code HEAD -- .
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Original host navigation responsive controls and computed text contrast
        run: npm run test:browser -- tests/approved-tech-checks.browser.spec.mjs tests/approved-tech-checks-contrast.browser.spec.mjs tests/tech-checks-navigation.browser.spec.mjs tests/approved-board-actions.browser.spec.mjs tests/approved-fleet-views.browser.spec.mjs tests/approved-fleet-unit.browser.spec.mjs tests/approved-tool-search.browser.spec.mjs tests/fleet-first-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-check-final/browser.log
      - name: Preserve evidence and screenshots including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-check-final-${{ github.sha }}
          path: |
            cos-check-final/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
