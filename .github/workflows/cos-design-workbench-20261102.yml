# Read-only completion review on the approved design branch. No deployment or writeback.
name: COS design completion verification (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
  COS_REVIEWED_SOURCE: fa02ce6c898543dfa144ca52d3dfb571a3cffecb
defaults:
  run:
    shell: bash
    working-directory: tech-checks/operations
jobs:
  build:
    name: Exact source, typecheck and original build gate
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify source and preserve exact tracked files without Git credentials
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code "$COS_REVIEWED_SOURCE" HEAD -- . ../supabase ../app.js ../operations-host.js
          mkdir -p ../../cos-completion-source ../../cos-completion-build
          git archive --format=tar.gz --output=../../cos-completion-source/tracked-source.tar.gz HEAD
          git ls-tree -r HEAD > ../../cos-completion-source/git-tree.txt
          git diff 38a4fb9e16a565d92fc5bd5c0e5a6f55e7337137 HEAD -- src tests proposals ../../docs/cos-approved-navigation > ../../cos-completion-source/design-source.patch
          printf '%s\n' "$GITHUB_SHA" > ../../cos-completion-source/source-sha.txt
          sha256sum ../../cos-completion-source/tracked-source.tar.gz > ../../cos-completion-source/archive.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-completion-source-${{ github.sha }}
          path: cos-completion-source/
          retention-days: 7
          if-no-files-found: error
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full project typecheck and original authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-completion-build/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-completion-build/auth.log
      - name: Exact source-preservation adapters
        run: |
          node tests/approved-shell-test-source.mjs check
          node tests/approved-phone-navigation-source.mjs check
          node tests/approved-more-drawer-source.mjs check
      - name: Complete build and original unmodified compiled-artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-completion-build/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-completion-build/artifact-gate.log
          git diff --exit-code HEAD -- .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cos-completion-build-${{ github.sha }}
          path: cos-completion-build/
          retention-days: 7
          if-no-files-found: warn
  unit:
    name: Complete current unit suite and inactive identity resolver
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete existing synthetic unit suite without filtering or assertion changes
        run: |
          mkdir -p ../../cos-completion-unit
          printf '%s\n' "$GITHUB_SHA" > ../../cos-completion-unit/source-sha.txt
          npm test 2>&1 | tee ../../cos-completion-unit/unit.log
      - name: Inactive server identity SQL and route proposal checks
        if: ${{ !cancelled() }}
        run: node --import tsx --test proposals/board-unit-link/tests/*.test.mjs 2>&1 | tee ../../cos-completion-unit/resolver.log
      - name: Source and lockfile remain unchanged
        if: always()
        run: git diff --exit-code HEAD -- .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cos-completion-unit-${{ github.sha }}
          path: cos-completion-unit/
          retention-days: 7
          if-no-files-found: warn
  browser:
    name: Full browser regression shard ${{ matrix.shard }} of 6
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact candidate and verify original artifact gate
        run: |
          mkdir -p ../../cos-completion-browser
          printf '%s\n' "$GITHUB_SHA" > ../../cos-completion-browser/source-sha.txt
          npm run build
          node ../../.github/scripts/verify-cos-build-artifact.mjs
          git diff --exit-code HEAD -- .
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Full test distribution; stop this shard after fifteen failures without hiding them
        run: npm run test:browser -- --shard=${{ matrix.shard }}/6 --workers=2 --retries=0 --max-failures=15 2>&1 | tee ../../cos-completion-browser/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cos-completion-browser-${{ matrix.shard }}-${{ github.sha }}
          path: |
            cos-completion-browser/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
