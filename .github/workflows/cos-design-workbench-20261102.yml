# Final attached-candidate verification. No patching, staging, ref writes or deployment.
name: COS design shell regressions (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {shell: bash, working-directory: tech-checks/operations}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify attached package and unchanged protected runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code 194f117cd769f3881c054c8b2563591ef546811f HEAD -- .
          git diff --exit-code c8d2bbc4348ec94dd44e9edd1e01d92e5fa307f3 HEAD -- src ':!src/approvedCosNavigation.css' ../supabase ../app.js ../operations-host.js package.json package-lock.json
          mkdir -p ../../cos-shell-final
          printf '%s\n' "$GITHUB_SHA" > ../../cos-shell-final/source-sha.txt
          node tests/approved-shell-test-source.mjs check
          node tests/approved-phone-navigation-source.mjs check
          node tests/approved-more-drawer-source.mjs check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused source-preservation and phone-navigation regressions
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs tests/approved-board-actions.test.mjs tests/approved-tech-checks.test.mjs tests/approved-team-job-links.test.mjs tests/approved-more-drawer.test.mjs tests/approved-phone-navigation-preservation.test.mjs 2>&1 | tee ../../cos-shell-final/unit.log
      - name: Full typecheck and original authentication-preservation check
        run: |
          npm run typecheck 2>&1 | tee ../../cos-shell-final/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-shell-final/auth.log
      - name: Complete build and original unmodified compiled-artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-shell-final/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-shell-final/artifact-gate.log
          git diff --exit-code HEAD -- .
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Complete shell suites More search and preserved IT navigation
        run: npm run test:browser -- tests/company-theme.browser.spec.mjs tests/company-overview.browser.spec.mjs tests/responsive-host.browser.spec.mjs tests/approved-layout.browser.spec.mjs tests/approved-workspace-navigation.browser.spec.mjs tests/approved-tool-search.browser.spec.mjs tests/fleet-first-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-shell-final/browser.log
      - name: Preserve results and screenshots including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-shell-final-${{ github.sha }}
          path: |
            cos-shell-final/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
