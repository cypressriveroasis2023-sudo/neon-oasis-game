# Isolated candidate verification and inert blob staging. No merge, ref write or deployment.
name: COS design Board actions (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      browser: ${{ steps.browser.outcome }}
      build: ${{ steps.build.outcome }}
    defaults:
      run: {shell: bash, working-directory: tech-checks/operations}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Preserve protected source and apply only the reviewed action wrapper
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code e50a4b63811c5eb2704ef68a63b1b8c0a92d9c4d HEAD -- ../supabase ../app.js ../operations-host.js package.json package-lock.json
          git diff --exit-code e50a4b63811c5eb2704ef68a63b1b8c0a92d9c4d HEAD -- src ':!src/ApprovedBoardActions.tsx' ':!src/approvedBoardActions.css'
          test "$(git hash-object src/DailyBoard.tsx)" = 0734601d3a4e5d0f18128c1cfb8197d1f50ee834
          test "$(git hash-object tests/board-record-details.test.mjs)" = fc1a2873e579c4588602a3e77bf94e836e0f84e1
          test "$(git hash-object src/approvedBoardActions.css)" = cbb9799bc62e3e5ab9381af5fbdde5374761db1b
          python - <<'PY'
          from pathlib import Path
          p=Path('src/DailyBoard.tsx');s=p.read_text()
          lines=[line for line in s.splitlines() if "<div className='daily-board-actions'>{canManage(selected)" in line]
          assert len(lines)==1
          old=lines[0];new=old.replace("<div className='daily-board-actions'>",'<ApprovedBoardActions>',1)
          assert new.endswith('</div>')
          new=new[:-6]+'</ApprovedBoardActions>'
          p.write_text("import ApprovedBoardActions from './ApprovedBoardActions';\n"+s.replace(old,new))
          p=Path('tests/board-record-details.test.mjs');s=p.read_text()
          assert s.count("let source=read('DailyBoard.tsx');")==1
          p.write_text("import {originalBoardActionsMarkup} from './approved-board-actions-source.mjs';\n"+s.replace("let source=read('DailyBoard.tsx');","let source=originalBoardActionsMarkup(read('DailyBoard.tsx'));"))
          PY
          test "$(git hash-object src/DailyBoard.tsx)" = 804702245f1ddd87bb3023ed7c22330e0beb32f0
          test "$(git hash-object tests/board-record-details.test.mjs)" = ecd3c9c23d78a9fb05a7eb11500b5abd0c49f03b
          mkdir -p ../../cos-board-candidate/payload/src ../../cos-board-candidate/payload/tests
          cp src/DailyBoard.tsx ../../cos-board-candidate/payload/src/
          cp tests/board-record-details.test.mjs ../../cos-board-candidate/payload/tests/
          printf '%s\n' "$GITHUB_SHA" > ../../cos-board-candidate/source-sha.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Existing focused regressions plus Board action preservation
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs tests/approved-board-actions.test.mjs 2>&1 | tee ../../cos-board-candidate/unit.log
      - name: Full typecheck and original technician authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-board-candidate/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-board-candidate/auth.log
      - name: Full build and independent candidate hashes
        id: build
        run: |
          npm run build 2>&1 | tee ../../cos-board-candidate/build.log
          printf '%s\n' 'a8528d24a49e624f5219b1a687d37e5d11d9ef95fdfdcdb8034507cd57b8cc81  dist/index.html' 'b60a4826b86f1444837baa36067823e9f2ce7d064f9297d98bba1c8c6437e82e  dist/assets/index-DH3TUQ9n.js' 'e02e429a900f4713810722e8d0602c1bb80e9c992eed8d72131d6e1e4495ea73  dist/assets/index-BrnUPkGR.css' | sha256sum --check
          mkdir -p ../../cos-board-candidate/payload/dist/assets
          cp dist/index.html ../../cos-board-candidate/payload/dist/
          cp dist/assets/index-DH3TUQ9n.js dist/assets/index-BrnUPkGR.css ../../cos-board-candidate/payload/dist/assets/
          git diff --exit-code HEAD -- package-lock.json
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Actual Board interactions and prior Fleet/navigation screens
        id: browser
        run: npm run test:browser -- tests/approved-board-actions.browser.spec.mjs tests/approved-fleet-views.browser.spec.mjs tests/approved-fleet-unit.browser.spec.mjs tests/approved-tool-search.browser.spec.mjs tests/fleet-first-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-board-candidate/browser.log
      - name: Original committed-artifact gate (failure is not waived)
        run: node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-board-candidate/artifact-gate.log
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-board-candidate-${{ github.sha }}
          path: |
            cos-board-candidate/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: error
  stage-blobs:
    needs: verify
    if: always() && needs.verify.outputs.browser == 'success' && needs.verify.outputs.build == 'success' && github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'cos-board-candidate-${{ github.sha }}', path: verified}
      - name: Stage only five independently verified Git blobs, never update a ref
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          assert.equal(process.env.GITHUB_REPOSITORY,'cypressriveroasis2023-sudo/neon-oasis-game');
          assert.equal(process.env.GITHUB_REF,'refs/heads/design/cos-approved-navigation-20261101');
          assert.equal(readFileSync('verified/cos-board-candidate/source-sha.txt','utf8').trim(),process.env.GITHUB_SHA);
          const expected={'src/DailyBoard.tsx':'32879e05ce3d0b95971dc8e225ebbbb7de2752f32ef322038175389b6a93a6fd','tests/board-record-details.test.mjs':'80c30f7190b553a965d23ff5ac098472e80b6b1f985e07fadd88fe3ee5d95763','dist/index.html':'a8528d24a49e624f5219b1a687d37e5d11d9ef95fdfdcdb8034507cd57b8cc81','dist/assets/index-DH3TUQ9n.js':'b60a4826b86f1444837baa36067823e9f2ce7d064f9297d98bba1c8c6437e82e','dist/assets/index-BrnUPkGR.css':'e02e429a900f4713810722e8d0602c1bb80e9c992eed8d72131d6e1e4495ea73'};
          const files=Object.entries(expected).map(([path,digest])=>{const bytes=readFileSync('verified/cos-board-candidate/payload/'+path);assert.equal(createHash('sha256').update(bytes).digest('hex'),digest);return {path,bytes,sha:createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex')};});
          const receipt=[];
          for(const file of files){const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({encoding:'base64',content:file.bytes.toString('base64')})});assert.equal(response.status,201);const data=await response.json();assert.equal(data.sha,file.sha);receipt.push({path:'tech-checks/operations/'+file.path,sha:data.sha});}
          writeFileSync('board-blob-receipt.json',JSON.stringify(receipt,null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'cos-board-blob-receipt-${{ github.sha }}', path: board-blob-receipt.json, retention-days: 7}
