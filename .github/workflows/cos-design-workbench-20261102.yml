# Final attached-candidate checks only. No patching, staging, ref write or deployment.
name: COS design Board actions (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {shell: bash, working-directory: tech-checks/operations}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify attached candidate and unchanged protected runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code e2de0da5882815621937d9a3c4286f81a08b2bf0 HEAD -- .
          git diff --exit-code e50a4b63811c5eb2704ef68a63b1b8c0a92d9c4d HEAD -- ../supabase ../app.js ../operations-host.js package.json package-lock.json
          git diff --exit-code e50a4b63811c5eb2704ef68a63b1b8c0a92d9c4d HEAD -- src ':!src/DailyBoard.tsx' ':!src/ApprovedBoardActions.tsx' ':!src/approvedBoardActions.css'
          test "$(git hash-object src/DailyBoard.tsx)" = 804702245f1ddd87bb3023ed7c22330e0beb32f0
          test "$(git hash-object tests/board-record-details.test.mjs)" = ecd3c9c23d78a9fb05a7eb11500b5abd0c49f03b
          mkdir -p ../../cos-board-final
          printf '%s\n' "$GITHUB_SHA" > ../../cos-board-final/source-sha.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused source-preservation navigation Board TV and Fleet tests
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs tests/approved-board-actions.test.mjs 2>&1 | tee ../../cos-board-final/unit.log
      - name: Full project typecheck and original technician authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-board-final/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-board-final/auth.log
      - name: Complete application build and original unmodified committed-artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-board-final/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-board-final/artifact-gate.log
          git diff --exit-code HEAD -- .
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Full-App Board actions and existing Fleet navigation at three widths
        run: npm run test:browser -- tests/approved-board-actions.browser.spec.mjs tests/approved-fleet-views.browser.spec.mjs tests/approved-fleet-unit.browser.spec.mjs tests/approved-tool-search.browser.spec.mjs tests/fleet-first-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-board-final/browser.log
      - name: Preserve results and screenshots including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-board-final-${{ github.sha }}
          path: |
            cos-board-final/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: error
