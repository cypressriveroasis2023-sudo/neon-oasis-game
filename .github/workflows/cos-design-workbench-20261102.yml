# Final exact-head validation: no workdir patching, staging, ref writes or deployment.
name: COS design Board unit navigation (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {shell: bash, working-directory: tech-checks/operations}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify attached candidate and unchanged protected runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code e7e54d5512f62153d0f81067498b0e222aef272a HEAD -- .
          git diff --exit-code b9d8a728f9212b204603f9a9ae5b46ed34e26973 HEAD -- src ':!src/BoardRecordDetails.tsx' ':!src/ApprovedBoardUnitLink.tsx' ':!src/approvedBoardUnitLink.ts' ../supabase ../app.js ../operations-host.js package.json package-lock.json proposals
          mkdir -p ../../cos-unit-link-final
          printf '%s\n' "$GITHUB_SHA" > ../../cos-unit-link-final/source-sha.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const hashes={'src/BoardRecordDetails.tsx':'c2beb901bc364be020967922eb8932e768279a0910909f3c8902eb445501feaa','src/ApprovedBoardUnitLink.tsx':'eb728d229238a670361ef68b997454148f4c76bedbdc7e10dbeaf38c077b917b','src/approvedBoardUnitLink.ts':'bff69bce207c2038ceef6d8dbed3f003bc202aa52711016fa8e34b734a7e8a73','tests/approved-board-unit-link.test.mjs':'2addbc7c4418049fed90bda7a6b3e6a9bd2a0acb95b7d356201dc0e57002afc9','tests/approved-board-unit-link.browser.spec.mjs':'4300192d5ce37840308cb7eda6c3dea2ca44ac87e7f8d0f2cc7bc8de407e0189'};
          for(const [file,hash]of Object.entries(hashes))if(createHash('sha256').update(readFileSync(file)).digest('hex')!==hash)throw Error('Attached source mismatch: '+file);
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserved original behavior and exact unit-link tests
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs tests/approved-board-actions.test.mjs tests/approved-tech-checks.test.mjs tests/approved-team-job-links.test.mjs tests/approved-board-unit-link.test.mjs proposals/board-unit-link/*.test.mjs 2>&1 | tee ../../cos-unit-link-final/unit.log
      - name: Full TypeScript and original authentication-preservation check
        run: |
          npm run typecheck 2>&1 | tee ../../cos-unit-link-final/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-unit-link-final/auth.log
      - name: Full application build and original unmodified artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-unit-link-final/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-unit-link-final/artifact-gate.log
          git diff --exit-code HEAD -- .
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Board exact unit route original actions and Fleet evidence
        run: npm run test:browser -- tests/approved-board-unit-link.browser.spec.mjs tests/approved-board-actions.browser.spec.mjs tests/approved-fleet-unit.browser.spec.mjs tests/approved-workspace-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-unit-link-final/browser.log
      - name: Retain results and screenshots including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-unit-link-final-${{ github.sha }}
          path: |
            cos-unit-link-final/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
