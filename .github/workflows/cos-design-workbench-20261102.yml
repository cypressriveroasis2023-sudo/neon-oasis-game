# Final read-only validation of the attached design candidate. No patching or publishing.
name: COS design Fleet views (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify exact attached source and protected paths without patching
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code dfb83e9b10fe1e84e7036e48c7c56d48a43397ff HEAD -- .
          git diff --exit-code 730e78a3f51e33a7d9209578ccbf77684563c1b8 HEAD -- ../supabase ../app.js ../operations-host.js package.json package-lock.json
          git diff --exit-code 730e78a3f51e33a7d9209578ccbf77684563c1b8 HEAD -- src ':!src/FleetDashboard.tsx' ':!src/ApprovedFleetViews.tsx' ':!src/approvedFleetViews.css'
          test "$(git hash-object src/FleetDashboard.tsx)" = 2350d7e000354b7f5bc65b85f28401cecb65de71
          mkdir -p ../../cos-fleet-views-final
          printf '%s\n' "$GITHUB_SHA" > ../../cos-fleet-views-final/source-sha.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: All focused navigation Board TV unit and Fleet grouping checks
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs 2>&1 | tee ../../cos-fleet-views-final/unit.log
      - name: Full typecheck and original technician authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-fleet-views-final/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-fleet-views-final/auth.log
      - name: Complete build and original unchanged committed-artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-fleet-views-final/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-fleet-views-final/artifact-gate.log
          git diff --exit-code HEAD -- .
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Full-App Fleet tools exact-unit opening and existing navigation at three widths
        run: npm run test:browser -- tests/approved-fleet-views.browser.spec.mjs tests/approved-fleet-unit.browser.spec.mjs tests/approved-tool-search.browser.spec.mjs tests/fleet-first-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-fleet-views-final/browser.log
      - name: Retain results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-fleet-views-final-${{ github.sha }}
          path: |
            cos-fleet-views-final/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
