# Final read-only validation. No stage-blobs, merge, branch write or deployment.
name: COS design unit drawer workbench (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify unchanged tested source and protected paths
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code b632508be55cc4c67c033d9d2c39fc2470e0f361 HEAD -- . ':!dist'
          git diff --exit-code 86180b5cd30be32d839f52ffdb594e845881e132 HEAD -- ../supabase ../app.js ../operations-host.js
          mkdir -p ../../cos-unit-final
          printf '%s\n' "$GITHUB_SHA" > ../../cos-unit-final/source-sha.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused navigation Board TV and source-preservation tests
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs 2>&1 | tee ../../cos-unit-final/unit.log
      - name: Full project typecheck and technician authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-unit-final/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-unit-final/auth.log
      - name: Complete build and original unchanged artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-unit-final/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-unit-final/artifact-gate.log
          git diff --exit-code HEAD -- .
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Full-App unit drawers and More navigation at three screen sizes
        run: npm run test:browser -- tests/approved-fleet-unit.browser.spec.mjs tests/approved-tool-search.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-unit-final/browser.log
      - name: Preserve results and screenshots including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-unit-final-${{ github.sha }}
          path: |
            cos-unit-final/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
