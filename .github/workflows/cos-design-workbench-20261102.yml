# Final read-only validation of the attached candidate. No patching, staging, ref writes or deployment.
name: COS design Team job links (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {shell: bash, working-directory: tech-checks/operations}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Verify attached source and unchanged protected runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$COS_RUN_LIVE_SMOKE" = 0
          git diff --exit-code b3105bfa44d3afd689e5b73611315634e0edbe99 HEAD -- .
          git diff --exit-code 0a5bd8f612924b761466dff5dfc95130fc74d0c6 HEAD -- ../supabase ../app.js ../operations-host.js package.json package-lock.json
          git diff --exit-code 0a5bd8f612924b761466dff5dfc95130fc74d0c6 HEAD -- src ':!src/TeamWorkspace.tsx' ':!src/ApprovedTeamJobLink.tsx' ':!src/approvedTeamJobRoute.ts' ':!src/approvedTeamJobs.css'
          mkdir -p ../../cos-team-final
          printf '%s\n' "$GITHUB_SHA" > ../../cos-team-final/source-sha.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused preservation navigation Board Fleet Tech Check and Team tests
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs tests/approved-fleet-unit.test.mjs tests/approved-fleet-views.test.mjs tests/approved-board-actions.test.mjs tests/approved-tech-checks.test.mjs tests/approved-team-job-links.test.mjs 2>&1 | tee ../../cos-team-final/unit.log
      - name: Full typecheck and original authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-team-final/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-team-final/auth.log
      - name: Full application build and original unmodified compiled-artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-team-final/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-team-final/artifact-gate.log
          git diff --exit-code HEAD -- .
      - name: Install repository-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Original Team assignment and readiness assertions
        run: npm run test:browser -- tests/directories.browser.spec.mjs --grep 'Team shows only actual roster' --workers=2 --retries=0 2>&1 | tee ../../cos-team-final/original-team.log
      - name: Exact Team job selection browser history and existing navigation
        run: npm run test:browser -- tests/approved-team-job-links.browser.spec.mjs tests/approved-workspace-navigation.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-team-final/browser.log
      - name: Retain results and screenshots including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-team-final-${{ github.sha }}
          path: |
            cos-team-final/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
