# Final read-only verification of the attached design candidate; no publisher.
name: COS design More navigation workbench (no deploy)
on:
  push:
    branches: [design/cos-approved-navigation-20261101]
    paths: ['.github/workflows/cos-design-workbench-20261102.yml']
permissions:
  contents: read
concurrency:
  group: cos-design-source-workbench
  cancel-in-progress: false
env:
  CI: 'true'
  COS_RUN_LIVE_SMOKE: '0'
jobs:
  verify:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game' && github.ref == 'refs/heads/design/cos-approved-navigation-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify the exact attached source without applying a patch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code c53fa4bc2123f59d82853efb22dacccf7401ceb9 HEAD -- .
          mkdir -p ../../cos-more-final
          printf '%s\n' "$GITHUB_SHA" > ../../cos-more-final/source-sha.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused navigation, Board, TV and search regressions
        run: node --import tsx --test tests/approved-cos-navigation.test.mjs tests/approved-navigation-cascade.test.mjs tests/board-record-details.test.mjs tests/owner-tv-display-lifecycle.test.mjs tests/approved-tool-search.test.mjs 2>&1 | tee ../../cos-more-final/unit.log
      - name: Full project typecheck and original technician authentication preservation
        run: |
          npm run typecheck 2>&1 | tee ../../cos-more-final/typecheck.log
          node tests/verify-techcheck-auth-preservation.mjs 2>&1 | tee ../../cos-more-final/auth.log
      - name: Canonical full application build and unmodified committed-artifact gate
        run: |
          npm run build 2>&1 | tee ../../cos-more-final/build.log
          node ../../.github/scripts/verify-cos-build-artifact.mjs 2>&1 | tee ../../cos-more-final/artifact-gate.log
          git diff --exit-code HEAD -- .
      - name: Install the project-pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Full-app More search at all three configured screen sizes
        run: npm run test:browser -- tests/approved-tool-search.browser.spec.mjs --workers=2 --retries=0 2>&1 | tee ../../cos-more-final/browser.log
      - name: Preserve results and screenshots, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-more-final-${{ github.sha }}
          path: |
            cos-more-final/
            tech-checks/operations/test-results/
            tech-checks/operations/playwright-report/
          retention-days: 7
          if-no-files-found: warn
