name: Temporary PR365 reviewed Fleet bundle builder
on:
  push:
    branches:
      - fix/fleet-refresh-preservation-20261107-pr364
    paths:
      - .github/workflows/cos-bundle-rebuild-pr365.yml
permissions:
  contents: write
concurrency:
  group: temporary-pr365-bundle
  cancel-in-progress: false
jobs:
  build-commit:
    if: github.repository == 'cypressriveroasis2023-sudo/neon-oasis-game'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - name: Stop if source or main changed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '641479120b56c6fffe91d18230c95467290772f6'
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse HEAD:tech-checks/operations/src/api.ts)" = '1114275296c4b59b85207fadd7da9e1b8d30ab4b'
          test "$(git rev-parse HEAD:tech-checks/operations/tests/fleet-connection-read-preservation.json)" = '260ff7681c5e4269c577372bc7f4879d6acf33ba'
      - name: Install locked frontend dependencies
        working-directory: tech-checks/operations
        run: npm ci --no-audit --no-fund
      - name: Validate exact source guards, contention regression and types
        working-directory: tech-checks/operations
        run: |
          node --import tsx --test tests/api-inflight-reads.test.mjs tests/approved-fleet-unit.test.mjs
          npm run typecheck
      - name: Rebuild deployable static files without clearing retained assets
        working-directory: tech-checks/operations
        run: npm run build
      - name: Stage only genuinely generated changed bundle assets
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- tech-checks/operations/package-lock.json
          git add -A tech-checks/operations/dist
          node --input-type=commonjs <<'NODE'
          const {execFileSync}=require('node:child_process');
          const assert=require('node:assert/strict');
          const entries=execFileSync('git',['diff','--cached','--name-status'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).map(line=>line.split('\t'));
          const staged=entries.map(([status,path])=>({status,path}));
          assert.equal(staged.length,3,'Expected exactly two new JS assets and one updated HTML file');
          assert.equal(staged.filter(x=>x.status==='M'&&x.path==='tech-checks/operations/dist/index.html').length,1,'Built index.html must be updated');
          assert.equal(staged.filter(x=>x.status==='A'&&/^tech-checks\/operations\/dist\/assets\/durableFleetClient-[\w-]+\.js$/.test(x.path)).length,1,'Expected one new durable Fleet chunk');
          assert.equal(staged.filter(x=>x.status==='A'&&/^tech-checks\/operations\/dist\/assets\/index-[\w-]+\.js$/.test(x.path)).length,1,'Expected one new app bundle');
          console.log(JSON.stringify(staged));
          NODE
          git diff --cached --check
      - name: Commit, check exact compiled bytes, then push candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'COS reviewed build automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'build(fleet): commit generated contention-repair frontend'
          (cd tech-checks/operations && node ../../.github/scripts/verify-cos-build-artifact.mjs)
          git push origin HEAD:fix/fleet-refresh-preservation-20261107-pr364
          git rev-parse HEAD
