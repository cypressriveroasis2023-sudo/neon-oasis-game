name: Verify seven canonical binding restoration
on:
  pull_request:
    paths:
      - 'tech-checks/operations/db/canonical_binding_restoration.sql'
      - 'tech-checks/operations/scripts/*CanonicalBinding*.mjs'
      - 'tech-checks/operations/tests/canonical-binding-*'
      - 'tech-checks/operations/tests/fixtures/canonical-restoration-*'
      - 'tech-checks/supabase/functions/cos-operations-pages/canonicalBindingRestoration.mjs'
      - '.github/workflows/cos-canonical-binding-restoration-proof.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - run: npm ci
      - run: npm ci --prefix legacy/tests/recon-ordering
      - name: Offline and in-memory database proofs
        run: node --test --test-concurrency=1 tests/canonical-binding-*.test.mjs
      - name: Real PostgreSQL role, atomicity and persistence proofs
        env:
          COS_RESTORATION_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cos_restoration_test_ci
        run: node --test --test-concurrency=1 tests/canonical-binding-restoration.test.mjs tests/canonical-binding-alias.test.mjs
      - name: Independent PostgreSQL sessions
        env:
          COS_RESTORATION_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cos_restoration_test_ci
        run: node tests/canonical-binding-restoration-postgres.mjs
