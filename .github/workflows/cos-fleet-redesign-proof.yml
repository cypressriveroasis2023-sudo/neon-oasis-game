name: Verify Fleet redesign and default entry
on:
  pull_request:
    paths:
      - 'tech-checks/operations/**'
      - 'tech-checks/supabase/functions/cos-operations-pages/vrm*.ts'
      - 'tech-checks/supabase/functions/cos-operations-pages/productVerifyNow.ts'
      - 'tech-checks/supabase/functions/cos-operations-pages/productCheckSource.ts'
      - 'tech-checks/docs/fleet-connection-reload-patch-20261103.json'
      - '.github/workflows/cos-fleet-redesign-proof.yml'
permissions:
  contents: read
jobs:
  fleet-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node --import tsx --test tests/fleet-entry-design.test.mjs tests/fleet-equipment-totals.test.mjs tests/fleet-workspace.test.mjs tests/fleet-dashboard.test.mjs tests/fleet-recorded-roster.test.mjs tests/fleet-command-center.test.mjs tests/recon-battery.test.mjs tests/helios-victron-cards.test.mjs tests/vrm-sharing-database.test.mjs tests/vrm-read-only-model.test.mjs tests/vrm-discovery.test.mjs tests/product-check-source.test.mjs tests/fleet-connection-reload.test.mjs tests/fleet-connection-readback.test.mjs tests/api-inflight-reads.test.mjs tests/product-verify-now.test.mjs tests/exact-product-connection.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --workers=3 --retries=0 tests/fleet-entry-design.browser.spec.mjs tests/helios-victron-cards.browser.spec.mjs tests/fleet-verify-now.browser.spec.mjs tests/fleet-full-reopen.browser.spec.mjs tests/operations-session-recovery.browser.spec.mjs tests/fleet-unified.browser.spec.mjs tests/fleet-map-groups.browser.spec.mjs tests/fleet-status-pins.browser.spec.mjs tests/fleet-shop-action.browser.spec.mjs tests/mhelp-connection-alert.browser.spec.mjs tests/mhelp-live-inventory.browser.spec.mjs tests/product-proof-refresh.browser.spec.mjs
      - name: Preserve actual desktop and phone screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-redesign-browser-evidence
          path: |
            tech-checks/operations/test-results
            tech-checks/operations/playwright-report
          if-no-files-found: ignore
