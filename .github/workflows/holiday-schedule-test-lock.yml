# Proves the holiday-schedule-test stub cannot write a camera schedule.
# It does not deploy and it does not call Supabase, a camera, Watchful, or monitoring.
name: Holiday schedule test lock
on:
  pull_request:
    paths:
      - 'tech-checks/supabase/functions/holiday-schedule-test/**'
      - '.github/workflows/holiday-schedule-test-lock.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove holiday-schedule-test cannot write a camera schedule
        run: node --experimental-strip-types --test --test-concurrency=1 tech-checks/supabase/functions/holiday-schedule-test/index.test.mjs
