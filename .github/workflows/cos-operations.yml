permissions:
  contents: write
concurrency:
  group: cos-operations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: cos_mhelp_intake_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cos_mhelp_intake_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package.json
      - name: Confirm existing technician workflows are unchanged
        run: |
          node tests/verify-techcheck-auth-preservation.mjs
          git diff --exit-code f9725fc776f91b7920a7cfc59d3d07c5dd6b53d3 -- ../technician-wizard-owner-dashboard-v5.js ../tech-check-rules.js ../it-prep-rules-v1.js ../it-prep-shared-v1.js ../it-prep-view-v1.js ../it-prep-wizard-v1.js ../it-intake-wizard-v1.js ../truck-spares-shared-v1.js
          # One explicitly reviewed main migration is present beyond the older
          # Tech Check baseline. Require EXACTLY that one migration difference.
          reviewed_migration='tech-checks/supabase/migrations/20261107_extend_internal_fleet_snapshot_read_timeout.sql'
          test "$(git diff --name-only f9725fc776f91b7920a7cfc59d3d07c5dd6b53d3 -- ../supabase/migrations)" = "$reviewed_migration"
          # Compare both committed object and on-disk bytes to the reviewed blob;
          # any new/modified migration or content drift still fails CI closed.
          reviewed_blob='be212be3ca031febc644d6d2a23816b9e7a12d91'
          test "$(git rev-parse HEAD:$reviewed_migration)" = "$reviewed_blob"
          test "$(git hash-object ../supabase/migrations/20261107_extend_internal_fleet_snapshot_read_timeout.sql)" = "$reviewed_blob"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify real PostgreSQL intake concurrency
        timeout-minutes: 5
        env:
          COS_MHELP_POSTGRES_CI: '1'
        run: |
          command -v psql
          node --import tsx legacy/tests/mhelp-postgres-concurrency.ci.mjs
      - name: Verify real PostgreSQL reconnect rotation and replay
        timeout-minutes: 5
        env:
          COS_MHELP_POSTGRES_CI: '1'
        run: node --import tsx legacy/tests/mhelp-reconnect-postgres.ci.mjs
      - name: Verify shared mHelp allowance, cache and renewal guard in real PostgreSQL
        timeout-minutes: 5
        env:
          COS_MHELP_POSTGRES_CI: '1'
        run: node --import tsx legacy/tests/mhelp-reliability-postgres.ci.mjs
      - run: npm run typecheck
      - name: Strictly typecheck the isolated MHelp address geocoder
        run: npx tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --lib ES2022,DOM,DOM.Iterable --skipLibCheck ../supabase/functions/cos-mhelp-address-geocodio/index.ts
      - run: npm run build
        id: build
      - name: Verify reviewed frontend bytes and unchanged lockfile
        run: node ../../.github/scripts/verify-cos-build-artifact.mjs
      - name: Preserve exact hosted frontend artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: cos-reviewed-frontend
          path: |
            cos-build-evidence/manifest.json
            tech-checks/operations/dist
          if-no-files-found: error
      - name: Install pinned project browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        timeout-minutes: 15
        id: browser_install
      - name: Verify legacy camera saved reads and guarded placement
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/camera-health-overview.browser.spec.mjs tests/camera-shop-field-restore.browser.spec.mjs tests/camera-place…11317 tokens truncated…[]'::jsonb)
 from jsonb_array_elements(b.value->'records')r
 left join app_private.vision_tracker_locations t on t.id=(r->'binding'->>'trackerId')::uuid)
)) from baseline b
)
select original.value || jsonb_build_object('cameraSnapshotSources',jsonb_build_object(
 'units',(select coalesce(jsonb_agg(jsonb_build_object('id',u.id,'organization_id',u.organization_id,'unit_number',u.unit_number,'status',u.status) order by u.id),'[]'::jsonb) from public.equipment_units u where u.organization_id='ece6d2a2-fd19-4cc7-b56a-2fa004a6d8f5'),
 'matches',(select coalesce(jsonb_agg(jsonb_build_object('id',m.id,'organization_id',m.organization_id,'equipment_unit_id',m.equipment_unit_id,'vigilant_device_id',m.vigilant_device_id,'camera_key',m.camera_key,'match_method',m.match_method,'confidence',m.confidence) order by m.id),'[]'::jsonb) from public.vision_vigilant_unit_matches m where m.organization_id='ece6d2a2-fd19-4cc7-b56a-2fa004a6d8f5'),
 'providers',(select coalesce(jsonb_agg(jsonb_build_object('id',d.id,'organization_id',d.organization_id,'external_device_id',d.external_device_id,'device_name',d.device_name,'device_type',d.device_type,'source',d.source) order by d.id),'[]'::jsonb) from public.vision_vigilant_devices d where d.organization_id='ece6d2a2-fd19-4cc7-b56a-2fa004a6d8f5'),
 'ownerCrosswalk',app_private.cos_owner_identity_snapshot_value('ece6d2a2-fd19-4cc7-b56a-2fa004a6d8f5'::uuid),
 'trackerUnits',(select coalesce(jsonb_agg(jsonb_build_object('id',t.id,'unitNumber',t.unit_number,'modelName',t.family,'readOnly',true,'recordSource',t.source_name,'snapshotImportedAt',t.imported_at,'sourceVerifiedAt',t.source_verified_at) order by t.id),'[]'::jsonb) from app_private.vision_tracker_locations t where t.organization_id='ece6d2a2-fd19-4cc7-b56a-2fa004a6d8f5')
)) from original;
$function$
;
do $guard$
begin
 if not pg_try_advisory_xact_lock(hashtextextended('COS_INVENTORY_GUARD_REUSE_20261113',0)) then raise exception 'Concurrent repair';end if;
 if exists(select 1 from (values
 ('cos_mhelp_placement_private.authoritative_product_records(jsonb,boolean)','9b53cb6ec820b518e24559ec0395641dc040f5b6aeb79a5e36c3a443b3a61ace','{postgres=X/postgres}',false,'["search_path=\"\""]'::jsonb),
 ('public.cos_mhelp_inventory_baseline()','5063173bb68524cae3f5225b8e8521796af4b4f7fc55e3fa697ed835c878f6c2','{postgres=X/postgres,service_role=X/postgres}',true,'["search_path=\"\"", "work_mem=64MB"]'::jsonb)
 ) expected(signature,sha,acl,security_definer,settings)
 left join pg_proc p on p.oid=to_regprocedure(expected.signature)
 where p.oid is null or p.proowner::regrole::text<>'postgres'
 or p.proacl::text is distinct from expected.acl
 or p.prosecdef is distinct from expected.security_definer
 or to_jsonb(p.proconfig) is distinct from expected.settings
 or encode(sha256(convert_to(pg_get_functiondef(p.oid),'UTF8')),'hex') is distinct from expected.sha)
 then raise exception 'Function drift or permission mismatch; no repair applied';end if;
end $guard$;
commit;
