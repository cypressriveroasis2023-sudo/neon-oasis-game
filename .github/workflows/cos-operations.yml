name: Verify COS Operations
on:
  push:
    branches: [cos-operations-pages, main]
    paths:
      - 'tech-checks/operations/**'
      - 'tech-checks/sw.js'
      - 'tech-checks/operations-host.*'
      - 'tech-checks/verified-it-fleet-host.js'
      - 'tech-checks/it-daily-host.js'
      - 'tech-checks/it-daily-camera-host.js'
      - 'tech-checks/it-feature-availability.*'
      - 'tech-checks/it-mhelp-projection.js'
      - 'tech-checks/it-ticket-instructions-host.js'
      - 'tech-checks/vision-platform.css'
      - 'tech-checks/vision-workspace.js'
      - 'tech-checks/index.html'
      - 'tech-checks/company-*.css'
      - 'tech-checks/cos-eye-branding.*'
      - 'tech-checks/camera-health.html'
      - 'tech-checks/camera-placement-controls.js'
      - 'tech-checks/camera-placement-controls.css'
      - 'tech-checks/camera-health-history.js'
      - 'tech-checks/camera-diagnostic-report.js'
      - 'tech-checks/camera-health-history.css'
      - 'tech-checks/camera-health-overview.js'
      - 'tech-checks/camera-health-overview.css'
      - 'tech-checks/camera-detail.html'
      - 'tech-checks/onsite-vision.html'
      - 'tech-checks/onsite-vision.js'
      - 'tech-checks/onsite-vision-composer.css'
      - 'tech-checks/it-send-repair.html'
      - 'tech-checks/resources/fonts/**'
      - 'tech-checks/production-assignments-host.*'
      - 'tech-checks/supabase/functions/cos-operations-pages/**'
      - 'tech-checks/supabase/functions/cos-sheets-placement-publish/**'
      - 'tech-checks/supabase/functions/cos-mhelp-placement-sync/**'
      - 'tech-checks/supabase/functions/cos-vrm-fleet-sync/**'
      - 'tech-checks/supabase/functions/cos-mhelp-readiness/**'
      - 'tech-checks/supabase/functions/camera-mhelp-readiness/**'
      - 'tech-checks/supabase/functions/cos-mhelp-ticket-source/**'
      - 'tech-checks/supabase/functions/camera-mhelp-ticket-intake/**'
      - 'tech-checks/supabase/functions/camera-provider-reconcile/**'
      - 'tech-checks/supabase/functions/reconeyez-webhook/**'
      - 'tech-checks/database-maintenance/reconeyez-event-ordering.sql'
      - 'tech-checks/database-maintenance/tech-check-tv-settings.sql'
      - 'tech-checks/database-maintenance/tech-check-tv-display-settings.sql'
      - 'tech-checks/database-maintenance/tech-check-tv-timing-compatibility.sql'
      - 'tech-checks/supabase/functions/vigilant-sync/**'
      - 'tech-checks/supabase/database.types.ts'
      - 'tech-checks/supabase/functions/camera-field-geocode/**'
      - 'tech-checks/supabase/functions/cos-geocode-sources/**'
      - '.github/workflows/cos-operations.yml'
  pull_request:
    paths:
      - 'tech-checks/operations/**'
      - 'tech-checks/sw.js'
      - 'tech-checks/operations-host.*'
      - 'tech-checks/verified-it-fleet-host.js'
      - 'tech-checks/it-daily-host.js'
      - 'tech-checks/it-daily-camera-host.js'
      - 'tech-checks/it-feature-availability.*'
      - 'tech-checks/it-mhelp-projection.js'
      - 'tech-checks/it-ticket-instructions-host.js'
      - 'tech-checks/vision-platform.css'
      - 'tech-checks/vision-workspace.js'
      - 'tech-checks/index.html'
      - 'tech-checks/company-*.css'
      - 'tech-checks/cos-eye-branding.*'
      - 'tech-checks/camera-health.html'
      - 'tech-checks/camera-placement-controls.js'
      - 'tech-checks/camera-placement-controls.css'
      - 'tech-checks/camera-health-history.js'
      - 'tech-checks/camera-diagnostic-report.js'
      - 'tech-checks/camera-health-history.css'
      - 'tech-checks/camera-health-overview.js'
      - 'tech-checks/camera-health-overview.css'
      - 'tech-checks/camera-detail.html'
      - 'tech-checks/onsite-vision.html'
      - 'tech-checks/onsite-vision.js'
      - 'tech-checks/onsite-vision-composer.css'
      - 'tech-checks/it-send-repair.html'
      - 'tech-checks/resources/fonts/**'
      - 'tech-checks/production-assignments-host.*'
      - 'tech-checks/supabase/functions/cos-operations-pages/**'
      - 'tech-checks/supabase/functions/cos-sheets-placement-publish/**'
      - 'tech-checks/supabase/functions/cos-mhelp-placement-sync/**'
      - 'tech-checks/supabase/functions/cos-vrm-fleet-sync/**'
      - 'tech-checks/supabase/functions/cos-mhelp-readiness/**'
      - 'tech-checks/supabase/functions/camera-mhelp-readiness/**'
      - 'tech-checks/supabase/functions/cos-mhelp-ticket-source/**'
      - 'tech-checks/supabase/functions/camera-mhelp-ticket-intake/**'
      - 'tech-checks/supabase/functions/camera-provider-reconcile/**'
      - 'tech-checks/supabase/functions/reconeyez-webhook/**'
      - 'tech-checks/database-maintenance/reconeyez-event-ordering.sql'
      - 'tech-checks/database-maintenance/tech-check-tv-settings.sql'
      - 'tech-checks/database-maintenance/tech-check-tv-display-settings.sql'
      - 'tech-checks/database-maintenance/tech-check-tv-timing-compatibility.sql'
      - 'tech-checks/supabase/functions/vigilant-sync/**'
      - 'tech-checks/supabase/database.types.ts'
      - 'tech-checks/supabase/functions/camera-field-geocode/**'
      - 'tech-checks/supabase/functions/cos-geocode-sources/**'
      - '.github/workflows/cos-operations.yml'
permissions:
  contents: write
concurrency:
  group: cos-operations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: cos_mhelp_intake_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cos_mhelp_intake_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package.json
      - name: Confirm existing technician workflows are unchanged
        run: git diff --exit-code f9725fc776f91b7920a7cfc59d3d07c5dd6b53d3 -- ../app.js ../technician-wizard-owner-dashboard-v5.js ../tech-check-rules.js ../it-prep-rules-v1.js ../it-prep-shared-v1.js ../it-prep-view-v1.js ../it-prep-wizard-v1.js ../it-intake-wizard-v1.js ../truck-spares-shared-v1.js ../supabase/migrations
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify real PostgreSQL intake concurrency
        timeout-minutes: 5
        env:
          COS_MHELP_POSTGRES_CI: '1'
        run: |
          command -v psql
          node --import tsx legacy/tests/mhelp-postgres-concurrency.ci.mjs
      - name: Verify real PostgreSQL reconnect rotation and replay
        timeout-minutes: 5
        env:
          COS_MHELP_POSTGRES_CI: '1'
        run: node --import tsx legacy/tests/mhelp-reconnect-postgres.ci.mjs
      - run: npm run typecheck
      - run: npm run build
        id: build
      - run: npx playwright install --with-deps chromium
        id: browser_install
      - name: Verify source-equipment address estimate pins
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/source-equipment-pins.browser.spec.mjs
      - name: Source-equipment estimate pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-equipment-estimate-results
          path: tech-checks/operations/test-results
          if-no-files-found: ignore
      - name: Verify read-only Victron dashboards and shared eye branding
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/vrm.browser.spec.mjs tests/eye-branding.browser.spec.mjs tests/company-overview.browser.spec.mjs
      - name: Victron and eye branding pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victron-and-eye-ui-pixels
          path: tech-checks/operations/test-results/**/*.png
          if-no-files-found: ignore
      - name: Verify exact TV outage rotation before dashboard regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/tech-check-tv.browser.spec.mjs --grep "Camera Health rotates every red outage"
      - name: TV outage rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-outage-rotation-results
          path: tech-checks/operations/test-results
          if-no-files-found: ignore
      - name: Verify Fleet usability fixes and placement retry
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/fleet-usability.browser.spec.mjs tests/fleet-recorded-roster.browser.spec.mjs tests/camera-placement-prefill.browser.spec.mjs tests/fleet-unified.browser.spec.mjs tests/responsive-host.browser.spec.mjs tests/tech-checks-navigation.browser.spec.mjs tests/vrm.browser.spec.mjs tests/verified-health-identity.browser.spec.mjs tests/fleet-battery.browser.spec.mjs tests/camera-shop-field-restore.browser.spec.mjs tests/field-health-flow.browser.spec.mjs --grep "expanded cluster survives|Owner proof colors|four-minute saved-data|actual charge sources|incomplete existing FIELD correction rechecks source access|plain status circles expand|Field setup keeps|MHelp recorded addresses|missing locations|unit drawer scrolls|unverified combined roster|plain colored circles|Shop pending|approved Today workspace|leaving Tech Checks|IT with.*Victron capability"
      - name: Fleet usability pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-usability-visuals
          path: tech-checks/operations/test-results/**/*.png
          if-no-files-found: ignore
      - name: Verify saved-camera refresh timing and visibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/saved-camera-refresh.browser.spec.mjs
      - name: Saved-camera refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-camera-refresh-results
          path: tech-checks/operations/test-results
          if-no-files-found: ignore
      - name: Verify integrated Fleet Dashboard for Owner and IT
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/fleet-dashboard.browser.spec.mjs tests/fleet-unified.browser.spec.mjs tests/fleet-first-navigation.browser.spec.mjs tests/fleet-unit-cards.browser.spec.mjs tests/fleet-recorded-roster.browser.spec.mjs tests/company-platform.browser.spec.mjs tests/field-map-deep-link.browser.spec.mjs tests/owner-watchful-shortcut.browser.spec.mjs tests/routers.browser.spec.mjs tests/approved-layout.browser.spec.mjs tests/finance.browser.spec.mjs
      - name: Fleet candidate visual review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-candidate-visuals
          path: tech-checks/operations/test-results/**/*.png
          if-no-files-found: ignore
      - name: Verify guarded Owner Census preparation and one-use action
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/owner-census-preparation.browser.spec.mjs tests/owner-census-once.browser.spec.mjs
      - name: Verify Tech Check TV and IT daily navigation and camera scope
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/tech-check-tv.browser.spec.mjs tests/it-daily-mode.browser.spec.mjs tests/it-daily-camera.browser.spec.mjs tests/verified-it-fleet.browser.spec.mjs
      - name: Verify mHelp Owner, IT and Service interactions before the full browser suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: npm run test:browser -- tests/mhelp-intake-review.browser.spec.mjs tests/mhelp-ticket-preview.browser.spec.mjs tests/it-ticket-instructions.browser.spec.mjs tests/service-ticket-instructions.browser.spec.mjs tests/legacy-install-evidence.browser.spec.mjs tests/mhelp-location-import.browser.spec.mjs tests/field-map-progressive.browser.spec.mjs
      - name: Verify shared map migration and Owner portal regressions before the full browser suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        run: >-
          npm run test:browser --
          tests/camera-shop-field-restore.browser.spec.mjs
          tests/company-overview.browser.spec.mjs
          tests/field-address-estimates.browser.spec.mjs
          tests/field-health-flow.browser.spec.mjs
          tests/field-map-deep-link.browser.spec.mjs
          tests/field-recorder-observation.browser.spec.mjs
          tests/fleet-battery.browser.spec.mjs
          tests/operations.browser.spec.mjs
          tests/owner-watchful-shortcut.browser.spec.mjs
          tests/recorder-evaluation-clock.browser.spec.mjs
          tests/routers.browser.spec.mjs
          tests/shared-fleet-map.browser.spec.mjs
          tests/verified-health-identity.browser.spec.mjs
          tests/vision-dashboard.browser.spec.mjs
      - run: npm run test:browser
      - name: Browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-browser-results
          path: |
            tech-checks/operations/test-results
            tech-checks/operations/playwright-report
          if-no-files-found: ignore
      - name: Commit verified static bundle on publishing branch
        if: github.event_name == 'push' && (github.ref_name == 'cos-operations-pages' || github.ref_name == 'main')
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publishing_branch="${{ github.ref_name }}"
          git fetch origin "$publishing_branch"
          if git diff --quiet "origin/$publishing_branch" -- tech-checks/operations/dist tech-checks/operations/package-lock.json; then
            echo "Verified bundle is already published."
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$publishing_branch")" ]; then
            echo "Publishing branch advanced; its own verification must publish the newer bundle."
            exit 0
          fi
          git add tech-checks/operations/dist tech-checks/operations/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Build verified COS Operations static bundle"
            if ! git push origin "HEAD:$publishing_branch"; then
              git fetch origin "$publishing_branch"
              # A concurrent run may have published these exact verified bytes.
              git diff --exit-code "origin/$publishing_branch" -- tech-checks/operations/dist tech-checks/operations/package-lock.json
            fi
          fi

  verify-recon-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: recon_ordering_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recon_ordering_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tech-checks/operations/legacy/tests/recon-ordering
    env:
      RECON_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/recon_ordering_test_ci
      RECON_WEBHOOK_SOURCE: ../../../../supabase/functions/reconeyez-webhook/index.ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tech-checks/operations/legacy/tests/recon-ordering/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify ordered webhook handoff
        run: node --disable-warning=ExperimentalWarning edge-handler.test.mjs
      - name: Verify actual PostgreSQL 17.6 transactions and permissions
        run: node run-ci.mjs
      - name: Verify actual concurrent PostgreSQL clients
        run: node concurrency.mjs
      - name: Verify exactly-one Owner Census concurrency and permanent provider holds
        env:
          COS_OWNER_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cos_owner_one_census_test_ci
          COS_OWNER_TEST_RECEIPT: owner-one-census-receipt.json
        run: node ../../../tests/owner-one-census-postgres-concurrency.mjs
      - name: Owner one-Census PostgreSQL verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-one-census-postgres-results
          path: tech-checks/operations/legacy/tests/recon-ordering/owner-one-census-receipt.json
          if-no-files-found: ignore

