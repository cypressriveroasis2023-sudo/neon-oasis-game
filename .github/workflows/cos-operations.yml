name: Verify COS Operations
on:
  push:
    branches: [cos-operations-pages, main]
    paths:
      - 'tech-checks/operations/**'
      - 'tech-checks/sw.js'
      - 'tech-checks/operations-host.*'
      - 'tech-checks/verified-it-fleet-host.js'
      - 'tech-checks/it-mhelp-projection.js'
      - 'tech-checks/vision-platform.css'
      - 'tech-checks/vision-workspace.js'
      - 'tech-checks/index.html'
      - 'tech-checks/company-*.css'
      - 'tech-checks/cos-eye-branding.*'
      - 'tech-checks/camera-health.html'
      - 'tech-checks/camera-placement-controls.js'
      - 'tech-checks/camera-placement-controls.css'
      - 'tech-checks/camera-health-history.js'
      - 'tech-checks/camera-diagnostic-report.js'
      - 'tech-checks/camera-health-history.css'
      - 'tech-checks/camera-health-overview.js'
      - 'tech-checks/camera-health-overview.css'
      - 'tech-checks/camera-detail.html'
      - 'tech-checks/onsite-vision.html'
      - 'tech-checks/onsite-vision.js'
      - 'tech-checks/onsite-vision-composer.css'
      - 'tech-checks/it-send-repair.html'
      - 'tech-checks/resources/fonts/**'
      - 'tech-checks/production-assignments-host.*'
      - 'tech-checks/supabase/functions/cos-operations-pages/**'
      - 'tech-checks/supabase/functions/cos-vrm-fleet-sync/**'
      - 'tech-checks/supabase/functions/camera-field-geocode/**'
      - 'tech-checks/supabase/functions/cos-geocode-sources/**'
      - '.github/workflows/cos-operations.yml'
  pull_request:
    paths:
      - 'tech-checks/operations/**'
      - 'tech-checks/sw.js'
      - 'tech-checks/operations-host.*'
      - 'tech-checks/verified-it-fleet-host.js'
      - 'tech-checks/it-mhelp-projection.js'
      - 'tech-checks/vision-platform.css'
      - 'tech-checks/vision-workspace.js'
      - 'tech-checks/index.html'
      - 'tech-checks/company-*.css'
      - 'tech-checks/cos-eye-branding.*'
      - 'tech-checks/camera-health.html'
      - 'tech-checks/camera-placement-controls.js'
      - 'tech-checks/camera-placement-controls.css'
      - 'tech-checks/camera-health-history.js'
      - 'tech-checks/camera-diagnostic-report.js'
      - 'tech-checks/camera-health-history.css'
      - 'tech-checks/camera-health-overview.js'
      - 'tech-checks/camera-health-overview.css'
      - 'tech-checks/camera-detail.html'
      - 'tech-checks/onsite-vision.html'
      - 'tech-checks/onsite-vision.js'
      - 'tech-checks/onsite-vision-composer.css'
      - 'tech-checks/it-send-repair.html'
      - 'tech-checks/resources/fonts/**'
      - 'tech-checks/production-assignments-host.*'
      - 'tech-checks/supabase/functions/cos-operations-pages/**'
      - 'tech-checks/supabase/functions/cos-vrm-fleet-sync/**'
      - 'tech-checks/supabase/functions/camera-field-geocode/**'
      - 'tech-checks/supabase/functions/cos-geocode-sources/**'
      - '.github/workflows/cos-operations.yml'
permissions:
  contents: write
concurrency:
  group: cos-operations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tech-checks/operations
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tech-checks/operations/package.json
      - name: Confirm existing technician workflows are unchanged
        run: git diff --exit-code f9725fc776f91b7920a7cfc59d3d07c5dd6b53d3 -- ../app.js ../technician-wizard-owner-dashboard-v5.js ../tech-check-rules.js ../it-prep-rules-v1.js ../it-prep-shared-v1.js ../it-prep-view-v1.js ../it-prep-wizard-v1.js ../it-intake-wizard-v1.js ../truck-spares-shared-v1.js ../supabase/migrations
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-browser-results
          path: |
            tech-checks/operations/test-results
            tech-checks/operations/playwright-report
          if-no-files-found: ignore
      - name: Commit verified static bundle on publishing branch
        if: github.event_name == 'push' && (github.ref_name == 'cos-operations-pages' || github.ref_name == 'main')
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publishing_branch="${{ github.ref_name }}"
          git fetch origin "$publishing_branch"
          if git diff --quiet "origin/$publishing_branch" -- tech-checks/operations/dist tech-checks/operations/package-lock.json; then
            echo "Verified bundle is already published."
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$publishing_branch")" ]; then
            echo "Publishing branch advanced; its own verification must publish the newer bundle."
            exit 0
          fi
          git add tech-checks/operations/dist tech-checks/operations/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Build verified COS Operations static bundle"
            if ! git push origin "HEAD:$publishing_branch"; then
              git fetch origin "$publishing_branch"
              # A concurrent run may have published these exact verified bytes.
              git diff --exit-code "origin/$publishing_branch" -- tech-checks/operations/dist tech-checks/operations/package-lock.json
            fi
          fi
