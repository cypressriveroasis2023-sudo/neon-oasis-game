<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tech Check — IT Send Repair</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#152231;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:#071522;color:#fff;border-bottom:3px solid #d20b12;border-radius:16px;padding:20px;margin-bottom:16px}.hero b{color:#ef3434}.card{background:#fff;border:1px solid #dbe3ea;border-radius:16px;padding:18px;margin:14px 0}input{width:100%;padding:13px;border:1px solid #cbd4dd;border-radius:10px;font-size:16px;margin:5px 0 12px}button{width:100%;border:0;border-radius:11px;padding:14px;font-weight:900;font-size:16px;background:#d20b12;color:#fff;margin-top:8px}.secondary{background:#eef3f7;color:#26333f}.ok,.bad,.warn{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#e8f7ed;border:1px solid #acd6b8}.bad{background:#fdeceb;border:1px solid #efb4ae}.warn{background:#fff3df;border:1px solid #efcf9a}.small{font-size:13px;color:#687789}.unit{border:1px solid #dbe3ea;border-radius:12px;padding:12px;margin:10px 0}.hidden{display:none}</style></head><body><div class="wrap"><div class="hero"><div><b>CAMERAS</b> ONSITE</div><h1>Tech Check</h1><div>IT Send-to-Service Repair</div></div><div id="login" class="card"><h2>Sign In</h2><div class="small">Use your normal Tech Check username and password.</div><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button id="sign">Sign In</button><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="card"><h2>Pending IT Tickets</h2><div class="small">Uses the same Tech Check Supabase data and the current readiness rules.</div><button class="secondary" id="refresh">Refresh Tickets</button><div id="tickets"></div></div><button class="secondary" id="out">Sign Out</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://goqrnolcvqnirjmzaeyk.supabase.co','sb_publishable__URX6fCOr6KVvGsUsGS7wA_a1AmU7Rw'),AUTH='cameras-on-site.invalid';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function fields(i){if(['Solar Stand','Solar Pole'].includes(i.equipment_type))return['solar_mppt_updated_ok','solar_mppt_tested_ok','solar_pv_charging_ok','solar_panels_match_ok','ticket_item_match_ok'];if(['110V Stand','Pole'].includes(i.equipment_type))return['ticket_item_match_ok'];let f=['power_ok'];if(i.purpose==='DELIVERY'){if(i.equipment_type==='Helios')f.push('solar_mppt_tested_ok','solar_mppt_updated_ok','delivery_batteries_charged_ok','solar_pv_charging_ok');f.push('delivery_sim_ok','delivery_camera_app_ok');if(i.equipment_type==='Helios')f.push('solar_panels_match_ok');f.push('delivery_recording_ok','delivery_sd_formatted_ok');if(i.equipment_type!=='Helios')f.push('delivery_batteries_charged_ok');f.push('delivery_monitoring_ok');if(i.equipment_type!=='Helios')f.push('delivery_ticket_count_ok')}f.push('functions_ok','safe_ok');return f}
const names={power_ok:'Power on',functions_ok:'Functions tested',safe_ok:'Ready for field use',solar_mppt_tested_ok:'Cerbo online / visible in VRM',solar_mppt_updated_ok:'MPPT firmware / configuration updated',delivery_batteries_charged_ok:'Battery box fully charged',solar_pv_charging_ok:'Battery box charging from Helios tower solar panels',delivery_sim_ok:'Router / SIM ready',delivery_camera_app_ok:'Camera visible in app',solar_panels_match_ok:'All 3 required 1TB SD cards installed',delivery_recording_ok:'Recording verified before formatting',delivery_sd_formatted_ok:'All 3 1TB SD cards formatted after recording verification',delivery_monitoring_ok:'Central Station monitoring ready',delivery_ticket_count_ok:'Ticket quantity matches',ticket_item_match_ok:'Item matches MHelpDesk ticket'};
async function ev(id){let r=await db.from('handoff_evidence').select('*').eq('prep_ticket_id',id).eq('stage','it');if(r.error)throw r.error;return r.data||[]}
function issues(i,e,n){let a=[];if(!String(i.unit_tag||'').trim())a.push('Unit tag missing');if(+i.required_battery_count>0&&+i.battery_count<+i.required_battery_count)a.push('Battery / battery-box count below required amount');fields(i).forEach(f=>{if(i[f]!==true)a.push(names[f]||f)});let pre='unit-'+n+'-';if(!e.some(x=>x.kind==='photo'&&String(x.original_name||'').startsWith(pre)))a.push('Equipment photo missing');if(i.photo_tag_match_ok!==true)a.push('Photo unit tag not confirmed');if(!e.some(x=>x.kind==='signature'&&x.original_name==='unit-'+n+'-signature.png'))a.push('IT signature missing');return a}
async function load(){tickets.innerHTML='<div class="warn">Loading…</div>';let q=await db.from('prep_tickets').select('*,prep_items(*)').eq('status','draft').order('created_at',{ascending:true});if(q.error){tickets.innerHTML='<div class="bad">'+esc(q.error.message)+'</div>';return}let h='';for(const t of q.data||[]){let e=await ev(t.id),it=[...(t.prep_items||[])].sort((a,b)=>a.item_order-b.item_order),ex=+(t.expected_unit_count||it.length),all=[];it.forEach((x,k)=>{let z=issues(x,e,k+1);if(z.length)all.push('Unit '+(k+1)+' '+x.equipment_type+': '+z.join(', '))});if(it.length!==ex)all.push('Ticket has '+it.length+' of '+ex+' required units');h+='<div class="unit"><b>MHelpDesk #'+esc(t.ticket_no)+'</b><div>'+esc(t.site||'')+'</div><div class="small">'+it.length+' of '+ex+' units</div>'+(all.length?'<div class="bad"><b>Not ready yet</b><br>'+all.map(esc).join('<br>')+'</div>':'<div class="ok"><b>✓ All current required checks, photo/tag proof, and signatures are complete.</b></div><button onclick="send(\''+t.id+'\',\''+String(t.ticket_no).replace(/'/g,'')+'\')">Send to Service Tech →</button>')+'</div>'}tickets.innerHTML=h||'<div class="ok">No pending IT tickets.</div>'}
async function send(id,no){if(!confirm('Send MHelpDesk Ticket #'+no+' to Service Tech?'))return;let q=await db.from('prep_tickets').select('*,prep_items(*)').eq('id',id).single();if(q.error)return alert(q.error.message);let t=q.data,e=await ev(id),it=[...(t.prep_items||[])].sort((a,b)=>a.item_order-b.item_order),ex=+(t.expected_unit_count||it.length),all=[];it.forEach((x,k)=>all.push(...issues(x,e,k+1)));if(it.length!==ex)all.push('Unit count incomplete');if(all.length)return alert('A current requirement is still incomplete. Refresh this page to see the exact issue.');let r=await db.rpc('release_prep',{p_prep_id:id});if(r.error)return alert('Could not send: '+r.error.message);alert('MHelpDesk Ticket #'+no+' was sent to Service.');load()}
sign.onclick=async()=>{let r=await db.auth.signInWithPassword({email:u.value.trim().toLowerCase()+'@'+AUTH,password:p.value});if(r.error){loginMsg.innerHTML='<div class="bad">Username or password is incorrect.</div>';return}login.classList.add('hidden');app.classList.remove('hidden');load()};refresh.onclick=load;out.onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(({data})=>{if(data.session){login.classList.add('hidden');app.classList.remove('hidden');load()}});
</script></body></html>
