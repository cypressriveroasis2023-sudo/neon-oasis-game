<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tech Check — IT Send Repair</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#152231;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:#071522;color:white;border-bottom:3px solid #d20b12;border-radius:16px;padding:20px;margin-bottom:16px}.hero b{color:#ef3434}.card{background:#fff;border:1px solid #dbe3ea;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #122b4112}input{width:100%;padding:13px;border:1px solid #cbd4dd;border-radius:10px;font-size:16px;margin:5px 0 12px}button{width:100%;border:0;border-radius:11px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;background:#d20b12;color:#fff;margin-top:8px}button.secondary{background:#eef3f7;color:#26333f}.ok,.bad,.warn{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#e8f7ed;border:1px solid #acd6b8}.bad{background:#fdeceb;border:1px solid #efb4ae}.warn{background:#fff3df;border:1px solid #efcf9a}.small{font-size:13px;color:#687789}.unit{border:1px solid #dbe3ea;border-radius:12px;padding:12px;margin:10px 0}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}</style></head><body><div class="wrap"><div class="hero"><div><b>CAMERAS</b> ONSITE</div><h1>Tech Check</h1><div>IT Send-to-Service Repair</div></div><div id="login" class="card"><h2>Sign In</h2><div class="small">Use your normal Tech Check username and password.</div><input id="u" placeholder="Username" autocapitalize="none"><input id="p" type="password" placeholder="Password"><button id="sign">Sign In</button><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="card"><h2>Pending IT Tickets</h2><div class="small">This page uses the same Supabase data as Tech Check. It only fixes the final readiness/send step and does not delete or replace anything.</div><button class="secondary" id="refresh">Refresh Tickets</button><div id="tickets"></div></div><div class="row"><button class="secondary" id="back">Open Regular Tech Check</button><button class="secondary" id="out">Sign Out</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://goqrnolcvqnirjmzaeyk.supabase.co',KEY='sb_publishable__URX6fCOr6KVvGsUsGS7wA_a1AmU7Rw',db=supabase.createClient(URL,KEY),AUTH='cameras-on-site.invalid';
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function reqFields(i){if(['Solar Stand','Solar Pole'].includes(i.equipment_type))return ['solar_mppt_updated_ok','solar_mppt_tested_ok','solar_pv_charging_ok','solar_panels_match_ok','ticket_item_match_ok'];if(['110V Stand','Pole'].includes(i.equipment_type))return ['ticket_item_match_ok'];let f=['power_ok'];if(i.purpose==='DELIVERY'){if(i.equipment_type==='Helios')f.push('solar_mppt_tested_ok','solar_mppt_updated_ok','delivery_batteries_charged_ok','solar_pv_charging_ok');f.push('delivery_sim_ok','delivery_camera_app_ok');if(i.equipment_type==='Helios')f.push('solar_panels_match_ok');f.push('delivery_recording_ok','delivery_sd_formatted_ok');if(i.equipment_type!=='Helios')f.push('delivery_batteries_charged_ok');f.push('delivery_monitoring_ok');if(i.equipment_type!=='Helios')f.push('delivery_ticket_count_ok')}f.push('functions_ok','safe_ok');return f}
function label(k){return ({power_ok:'Power on',functions_ok:'Functions tested',safe_ok:'Ready for field use',solar_mppt_tested_ok:'Cerbo / MPPT tested',solar_mppt_updated_ok:'MPPT updated',delivery_batteries_charged_ok:'Battery box charged',solar_pv_charging_ok:'Solar charging verified',delivery_sim_ok:'Router / SIM ready',delivery_camera_app_ok:'Camera app visible',solar_panels_match_ok:'Helios 3 × 1TB SD cards / correct solar requirement',delivery_recording_ok:'Recording verified before format',delivery_sd_formatted_ok:'Storage formatted after recording verification',delivery_monitoring_ok:'Central Station monitoring ready',delivery_ticket_count_ok:'Ticket equipment quantity matches',ticket_item_match_ok:'Item matches MHelpDesk ticket'})[k]||k}
async function evidence(id){const {data,error}=await db.from('handoff_evidence').select('*').eq('prep_ticket_id',id).eq('stage','it');if(error)throw error;return data||[]}
function issues(item,ev,n){let a=[];if(!String(item.unit_tag||'').trim())a.push('Unit tag missing');if(Number(item.required_battery_count||0)>0&&Number(item.battery_count||0)<Number(item.required_battery_count||0))a.push('Battery / battery-box count is below required amount');for(const f of reqFields(item))if(item[f]!==true)a.push(label(f));const pref='unit-'+n+'-';if(!ev.some(x=>x.kind==='photo'&&String(x.original_name||'').startsWith(pref)))a.push('Equipment photo missing');if(item.photo_tag_match_ok!==true)a.push('Photo unit tag not confirmed');if(!ev.some(x=>x.kind==='signature'&&x.original_name==='unit-'+n+'-signature.png'))a.push('IT signature missing');return a}
async function load(){ $('tickets').innerHTML='<div class="warn">Loading…</div>';const {data,error}=await db.from('prep_tickets').select('*,prep_items(*)').eq('status','draft').order('created_at',{ascending:true});if(error){$('tickets').innerHTML='<div class="bad">'+esc(error.message)+'</div>';return}let html='';for(const t of data||[]){const ev=await evidence(t.id),items=[...(t.prep_items||[])].sort((a,b)=>a.item_order-b.item_order),expected=Number(t.expected_unit_count||items.length),all=[];items.forEach((i,x)=>{const z=issues(i,ev,x+1);if(z.length)all.push('Unit '+(x+1)+' '+(i.equipment_type||'')+': '+z.join(', '))});if(items.length!==expected)all.push('Ticket has '+items.length+' of '+expected+' required units');html+='<div class="unit"><b>MHelpDesk #'+esc(t.ticket_no)+'</b><div>'+esc(t.site||'')+'</div><div class="small">'+items.length+' of '+expected+' units</div>'+(all.length?'<div class="bad"><b>Not ready yet</b><br>'+all.map(esc).join('<br>')+'</div><button class="secondary" onclick="location.href=\'https://tech-checks-at-cameras-on-site-tvitsy.v2.appdeploy.ai/\'">Return to Tech Check to correct issues</button>':'<div class="ok"><b>✓ All required checks, photo/tag proof, and signatures are complete.</b><div>This ticket is ready to send to Service.</div></div><button onclick="send(\''+t.id+'\',\''+esc(String(t.ticket_no)).replace(/'/g,'')+'\')">Send to Service Tech →</button>')+'</div>'} $('tickets').innerHTML=html||'<div class="ok">No pending IT tickets.</div>'}
async function send(id,no){if(!confirm('Send MHelpDesk Ticket #'+no+' to Service Tech?'))return;const {data:t,error:e}=await db.from('prep_tickets').select('*,prep_items(*)').eq('id',id).single();if(e)return alert(e.message);const ev=await evidence(id),items=[...(t.prep_items||[])].sort((a,b)=>a.item_order-b.item_order),expected=Number(t.expected_unit_count||items.length);let all=[];items.forEach((i,x)=>all.push(...issues(i,ev,x+1)));if(items.length!==expected)all.push('Unit count incomplete');if(all.length){alert('This ticket still has a requirement that needs attention. Refresh the page.');return load()}const {error}=await db.rpc('release_prep',{p_prep_id:id});if(error)return alert('Could not send: '+error.message);alert('MHelpDesk Ticket #'+no+' was sent to Service.');load()}
$('sign').onclick=async()=>{const u=$('u').value.trim().toLowerCase(),p=$('p').value;const {data,error}=await db.auth.signInWithPassword({email:u+'@'+AUTH,password:p});if(error){$('loginMsg').innerHTML='<div class="bad">Username or password is incorrect.</div>';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()};$('refresh').onclick=load;$('out').onclick=async()=>{await db.auth.signOut();location.reload()};$('back').onclick=()=>location.href='https://tech-checks-at-cameras-on-site-tvitsy.v2.appdeploy.ai/';db.auth.getSession().then(({data})=>{if(data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}});
</script></body></html>
